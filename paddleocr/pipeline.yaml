# Portable PP-StructureV3 profile for one 8 GiB Pascal GPU.
#
# Base PP-StructureV3 configuration. server.py applies the selected startup
# profile before construction, replacing the layout/detection models and
# disabling branches whose weights should not be loaded into memory.
pipeline_name: PP-StructureV3
batch_size: 1

use_doc_preprocessor: true
use_seal_recognition: true
use_table_recognition: true
use_formula_recognition: true
use_chart_recognition: true
use_region_detection: true
format_block_content: true
markdown_ignore_labels:
  - number
  - footnote
  - header
  - header_image
  - footer
  - footer_image
  - aside_text

SubModules:
  LayoutDetection:
    module_name: layout_detection
    model_name: PP-DocLayout-L
    model_dir: null
    batch_size: 1
    threshold: 0.4
    layout_nms: true
    layout_unclip_ratio: [1.0, 1.0]
    layout_merge_bboxes_mode: union

  ChartRecognition:
    module_name: chart_recognition
    model_name: PP-Chart2Table
    model_dir: null
    batch_size: 1

  RegionDetection:
    module_name: layout_detection
    model_name: PP-DocBlockLayout
    model_dir: null
    batch_size: 1
    layout_nms: true
    layout_merge_bboxes_mode: small

SubPipelines:
  DocPreprocessor:
    pipeline_name: doc_preprocessor
    batch_size: 1
    use_doc_orientation_classify: true
    use_doc_unwarping: true
    SubModules:
      DocOrientationClassify:
        module_name: doc_text_orientation
        model_name: PP-LCNet_x1_0_doc_ori
        model_dir: null
        batch_size: 1
      DocUnwarping:
        module_name: image_unwarping
        model_name: UVDoc
        model_dir: null

  GeneralOCR:
    pipeline_name: OCR
    batch_size: 1
    text_type: general
    use_doc_preprocessor: false
    use_textline_orientation: true
    SubModules:
      TextDetection:
        module_name: text_detection
        model_name: PP-OCRv6_medium_det
        model_dir: null
        # Official PP-StructureV3 GeneralOCR sizing preserves document text by
        # scaling the short side to 736 while retaining a 4000-pixel hard cap.
        limit_side_len: 736
        limit_type: min
        max_side_limit: 4000
        thresh: 0.3
        box_thresh: 0.6
        unclip_ratio: 1.5
      TextLineOrientation:
        module_name: textline_orientation
        model_name: PP-LCNet_x1_0_textline_ori
        model_dir: null
        batch_size: 1
      TextRecognition:
        module_name: text_recognition
        # PP-OCRv6 medium recognition does not support Cyrillic. Keep the v6
        # detector, but use the official higher-accuracy East Slavic v5 model
        # for Russian, Belarusian, Ukrainian and English documents.
        model_name: eslav_PP-OCRv5_mobile_rec
        model_dir: null
        batch_size: 1
        score_thresh: 0.0

  TableRecognition:
    # The compact v1 table pipeline uses the page-wide Cyrillic OCR results and
    # adds SLANet_plus cell/row/column structure only for detected table crops.
    # This avoids the five concurrently initialized models in table_recognition_v2.
    pipeline_name: table_recognition
    use_layout_detection: false
    use_doc_preprocessor: false
    use_ocr_model: false
    SubModules:
      TableStructureRecognition:
        module_name: table_structure_recognition
        model_name: SLANet_plus
        model_dir: null

  SealRecognition:
    pipeline_name: seal_recognition
    batch_size: 1
    use_layout_detection: false
    use_doc_preprocessor: false
    SubPipelines:
      SealOCR:
        pipeline_name: OCR
        batch_size: 1
        text_type: seal
        use_doc_preprocessor: false
        use_textline_orientation: false
        SubModules:
          TextDetection:
            module_name: seal_text_detection
            model_name: PP-OCRv4_server_seal_det
            model_dir: null
            limit_side_len: 736
            limit_type: min
            max_side_limit: 4000
            thresh: 0.2
            box_thresh: 0.6
            unclip_ratio: 0.5
          TextRecognition:
            module_name: text_recognition
            model_name: eslav_PP-OCRv5_mobile_rec
            model_dir: null
            batch_size: 1
            score_thresh: 0.0

  FormulaRecognition:
    pipeline_name: formula_recognition
    batch_size: 1
    use_layout_detection: false
    use_doc_preprocessor: false
    SubModules:
      FormulaRecognition:
        module_name: formula_recognition
        model_name: PP-FormulaNet_plus-S
        model_dir: null
        batch_size: 1
