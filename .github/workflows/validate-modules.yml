name: Validate portable modules

on:
  push:
  pull_request:

jobs:
  static-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python scripts/validate_repository.py
      - run: python -m unittest discover -s tests -v
      - run: python -m unittest discover -s modules/ragflow/src -p "test_*.py" -v
      - run: python -m unittest test_audit_portability -v
        working-directory: modules/paddleocr/src
