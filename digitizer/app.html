<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Оцифровка PDF</title>
  <style>
    :root{--bg:#eef1f5;--panel:#fff;--line:#d7dce4;--ink:#172033;--muted:#6b7280;--blue:#2563eb;--green:#16855b;--amber:#d97706;--red:#dc2626;--violet:#7c3aed}
    *{box-sizing:border-box}html,body{height:100%;margin:0;font:13px/1.4 Inter,Segoe UI,Arial,sans-serif;color:var(--ink);background:var(--bg)}
    button,input,select,textarea{font:inherit}button{border:0;border-radius:7px;padding:7px 10px;background:var(--blue);color:#fff;cursor:pointer}button:hover{filter:brightness(.96)}button:disabled{opacity:.45;cursor:default}.secondary{background:#eef2f7;color:#253044;border:1px solid var(--line)}.danger{background:var(--red)}.icon{padding:3px 6px;min-width:25px}
    header{height:54px;display:flex;align-items:center;gap:9px;padding:8px 12px;background:#111827;color:#fff}header h1{font-size:15px;margin:0 8px 0 0}header input{min-width:280px;flex:1;padding:8px;border:1px solid #4b5563;border-radius:7px;background:#1f2937;color:#fff}.header-status{max-width:340px;color:#cbd5e1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .layout{height:calc(100% - 54px);display:grid;grid-template-columns:minmax(480px,1.35fr) 248px minmax(360px,.9fr);gap:1px;background:var(--line)}.column{min-width:0;display:flex;flex-direction:column;background:var(--panel)}
    .toolbar{min-height:47px;display:flex;align-items:center;gap:7px;padding:7px 9px;border-bottom:1px solid var(--line)}.toolbar strong{white-space:nowrap}.toolbar select,.toolbar input{min-width:0;padding:6px;border:1px solid var(--line);border-radius:6px;background:#fff}.grow{flex:1}.scroll{overflow:auto;min-height:0;flex:1}
    .pdf-view{padding:18px;background:#cbd2dc;user-select:none}.pdf-page{position:relative;max-width:920px;margin:0 auto 18px;background:#fff;box-shadow:0 3px 14px #33415545}.pdf-page>img{display:block;width:100%;pointer-events:none}.overlay{position:absolute;inset:0;cursor:crosshair}.page-no{position:absolute;right:7px;bottom:6px;padding:2px 7px;border-radius:10px;background:#111827cc;color:#fff;font-size:11px;pointer-events:none}
    .region{position:absolute;border:2px solid var(--blue);background:#2563eb14;cursor:pointer}.region.pending{border-color:#64748b}.region.queued,.region.running{border-color:var(--amber);background:#f59e0b17}.region.recognized{border-color:var(--green);background:#10b98114}.region.modified{border-color:var(--violet);background:#8b5cf61a}.region.error{border-color:var(--red);background:#ef44441a}.region.selected{outline:3px solid #fff;box-shadow:0 0 0 5px #0f172a99}.region-label{position:absolute;left:-2px;top:-23px;max-width:220px;padding:2px 6px;border-radius:5px 5px 0 0;background:inherit;color:#fff;background-color:var(--blue);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.region-actions{display:none;position:absolute;right:2px;top:2px;gap:3px}.region:hover .region-actions,.region.selected .region-actions{display:flex}.region-actions button{padding:2px 5px;background:#111827e8}.grid-line{position:absolute;background:#f43f5e;z-index:2}.grid-line.v{top:0;bottom:0;width:2px;cursor:col-resize}.grid-line.h{left:0;right:0;height:2px;cursor:row-resize}
    .object-list{padding:7px;display:grid;align-content:start;gap:6px;background:#f8fafc}.object{padding:8px;border:1px solid var(--line);border-radius:8px;background:#fff;cursor:pointer}.object.active{border-color:var(--blue);box-shadow:0 0 0 2px #2563eb20}.object-head{display:flex;align-items:center;gap:6px}.object-name{min-width:0;flex:1;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.badge{padding:1px 5px;border-radius:10px;background:#eef2ff;color:#4338ca;font-size:10px}.region-list{margin-top:5px;display:grid;gap:3px}.region-row{display:flex;align-items:center;gap:4px;color:var(--muted);font-size:11px}.dot{width:7px;height:7px;border-radius:50%;background:#94a3b8}.dot.recognized{background:var(--green)}.dot.running,.dot.queued{background:var(--amber)}.dot.modified{background:var(--violet)}.dot.error{background:var(--red)}
    .toolbox{padding:8px;border-bottom:1px solid var(--line);display:grid;gap:6px}.toolbox button{text-align:left}.toolbox .active{background:#1d4ed8}.properties{padding:9px;display:grid;gap:7px;border-top:1px solid var(--line)}.field{display:grid;gap:3px}.field>span{color:var(--muted);font-size:11px}.field input,.field textarea,.field select{width:100%;padding:6px;border:1px solid var(--line);border-radius:6px}.field textarea{min-height:58px;resize:vertical}.check{display:flex;align-items:center;gap:5px}.hint{padding:7px;color:var(--muted);font-size:11px}
    .editor{padding:12px;background:#f8fafc}.empty{padding:32px 15px;text-align:center;color:var(--muted)}.card{margin-bottom:12px;border:1px solid var(--line);border-radius:9px;background:#fff;overflow:hidden}.card-head{display:flex;align-items:center;gap:8px;padding:8px 10px;background:#f1f5f9;border-bottom:1px solid var(--line)}.card-body{padding:10px}.value-editor{width:100%;min-height:86px;padding:8px;border:1px solid var(--line);border-radius:6px;resize:vertical}.table-wrap{overflow:auto}.data-table{border-collapse:collapse;width:100%;min-width:360px}.data-table th,.data-table td{border:1px solid var(--line);padding:0}.data-table input{width:100%;min-width:100px;padding:7px;border:0;background:transparent}.data-table th input{font-weight:600;background:#f8fafc}.add-row{margin-top:8px}.json-preview{white-space:pre-wrap;word-break:break-word;font:11px/1.45 Consolas,monospace;color:#334155}
    .toast{position:fixed;right:15px;bottom:15px;max-width:480px;padding:9px 12px;border-radius:8px;background:#111827;color:#fff;box-shadow:0 5px 20px #0005;display:none;z-index:20}.toast.error{background:#991b1b}
    dialog{border:0;border-radius:10px;padding:0;box-shadow:0 20px 70px #0f172a55}dialog::backdrop{background:#0f172a88}.dialog-body{padding:16px;display:grid;gap:10px;min-width:340px}.dialog-foot{display:flex;justify-content:flex-end;gap:7px;padding:10px 16px;border-top:1px solid var(--line)}
    @media(max-width:1150px){.layout{grid-template-columns:minmax(430px,1.2fr) 220px minmax(330px,.9fr)}}
  </style>
</head>
<body>
  <header>
    <h1>Оцифровка PDF</h1>
    <button id="openFile">Открыть PDF…</button>
    <input id="sourceInput" placeholder="C:\Документы\скан.pdf или URL blob-хранилища">
    <button class="secondary" id="openSource">Открыть</button>
    <span class="header-status" id="status">Документ не открыт</span>
  </header>
  <main class="layout">
    <section class="column">
      <div class="toolbar">
        <strong id="documentName">PDF и разметка</strong><span class="grow"></span>
        <button class="secondary" id="zoomOut">−</button><span id="zoomLabel">100%</span><button class="secondary" id="zoomIn">+</button>
      </div>
      <div class="scroll pdf-view" id="pdfView"><div class="empty">Откройте PDF. Текстовый слой документа использоваться не будет.</div></div>
    </section>

    <section class="column">
      <div class="toolbar"><strong>Объекты</strong><span class="grow"></span><button class="icon" id="addField" title="Поле">+Aa</button><button class="icon" id="addTable" title="Таблица">+▦</button></div>
      <div class="toolbox" id="tools">
        <button data-tool="field" disabled>Выделить значение поля</button>
        <button data-tool="table_header" disabled>Заголовки таблицы</button>
        <button data-tool="table_rows" disabled>Строки таблицы</button>
        <button data-tool="group_value" disabled>Общее значение для строк</button>
        <button class="secondary" id="addColumn" disabled>+ граница столбца</button>
        <button class="secondary" id="addRow" disabled>+ граница строки</button>
      </div>
      <div class="scroll object-list" id="objectList"><div class="empty">Создайте поле или таблицу</div></div>
      <div class="properties">
        <label class="field"><span>Имя / сущность JSON</span><input id="objectName" disabled></label>
        <label class="field group-column" hidden><span>Столбец общего значения</span><input id="groupColumn" placeholder="Раздел"></label>
        <label class="check"><input type="checkbox" id="useLlm" disabled> обработать результат через llama.cpp</label>
        <label class="field"><span>Промпт выбранной области</span><textarea id="prompt" disabled placeholder="Исправь ошибки OCR и верни только текст"></textarea></label>
        <button class="danger" id="deleteObject" disabled>Удалить объект</button>
      </div>
    </section>

    <section class="column">
      <div class="toolbar">
        <select id="templateSelect" class="grow"><option value="">Без шаблона</option></select>
        <button class="secondary" id="applyTemplate">Применить</button>
        <button class="secondary" id="saveTemplate">Сохранить шаблон</button>
      </div>
      <div class="toolbar"><strong>Распознанные сущности</strong><span class="grow"></span><button id="saveDocument" disabled>Сохранить JSON</button><button class="secondary" id="exportJson" disabled>Экспорт</button></div>
      <div class="scroll editor" id="editor"><div class="empty">Результаты появятся здесь и останутся связаны с областями PDF</div></div>
    </section>
  </main>
  <div class="toast" id="toast"></div>

  <dialog id="nameDialog">
    <div class="dialog-body"><strong id="nameTitle">Новый объект</strong><label class="field"><span>Имя поля в JSON</span><input id="newName"></label></div>
    <div class="dialog-foot"><button class="secondary" id="nameCancel">Отмена</button><button id="nameOk">Создать</button></div>
  </dialog>
  <dialog id="templateDialog">
    <div class="dialog-body"><strong>Сохранить текущую разметку как шаблон</strong><label class="field"><span>Название шаблона</span><input id="templateName"></label></div>
    <div class="dialog-foot"><button class="secondary" id="templateCancel">Отмена</button><button id="templateOk">Сохранить</button></div>
  </dialog>

  <script>
    const state={source:null,doc:null,selectedObject:null,selectedRegion:null,tool:null,zoom:1,dirty:false,draw:null,tasks:new Set()};
    const $=id=>document.getElementById(id), uid=()=>crypto.randomUUID().replaceAll('-','');
    const kindName={field:'поле',table_header:'заголовки',table_rows:'строки',group_value:'общее значение'};
    async function api(url,options={}){const response=await fetch(url,{headers:{'Content-Type':'application/json'},...options});const type=response.headers.get('content-type')||'';const data=type.includes('json')?await response.json():await response.text();if(!response.ok)throw new Error(data.detail||data||`HTTP ${response.status}`);return data}
    function toast(message,error=false){const box=$('toast');box.textContent=message;box.className=`toast${error?' error':''}`;box.style.display='block';clearTimeout(box.timer);box.timer=setTimeout(()=>box.style.display='none',4500)}
    function setStatus(text){$('status').textContent=text}
    function currentObject(){return state.doc?.objects.find(x=>x.id===state.selectedObject)}
    function currentRegion(){return currentObject()?.regions?.find(x=>x.id===state.selectedRegion)}
    function markDirty(){state.dirty=true;$('saveDocument').disabled=false}
    function emptyResult(type){return type==='field'?{value:''}:{columns:[],rows:[],groups:{}}}

    async function openSource(source){if(!source)return;try{setStatus('Открытие…');const payload=await api(`/api/document?source=${encodeURIComponent(source)}`);state.source=payload.source;state.doc=payload.document;state.selectedObject=state.doc.objects[0]?.id||null;state.selectedRegion=null;state.dirty=false;$('sourceInput').value=state.source;$('documentName').textContent=payload.name;$('saveDocument').disabled=true;$('exportJson').disabled=false;renderAll();await loadTemplates();setStatus(`${state.doc.pageCount} стр. · ${state.doc.objects.length} объектов`)}catch(error){toast(error.message,true);setStatus('Ошибка открытия')}}
    async function openDialog(){try{const value=await api('/api/open/dialog',{method:'POST',body:'{}'});if(!value.cancelled)openSource(value.source)}catch(error){toast(error.message,true)}}

    function addObject(type){$('nameTitle').textContent=type==='field'?'Новое поле':'Новая таблица';$('newName').value=type==='field'?`field_${state.doc.objects.length+1}`:`table_${state.doc.objects.length+1}`;$('nameDialog').dataset.type=type;$('nameDialog').showModal();$('newName').select()}
    function confirmObject(){const type=$('nameDialog').dataset.type,name=$('newName').value.trim();if(!name)return;const obj={id:uid(),type,name,key:name,status:'pending',regions:[],result:emptyResult(type)};state.doc.objects.push(obj);state.selectedObject=obj.id;state.selectedRegion=null;$('nameDialog').close();markDirty();renderAll()}
    function deleteObject(){const obj=currentObject();if(!obj||!confirm(`Удалить объект «${obj.name}» и всю его разметку?`))return;state.doc.objects=state.doc.objects.filter(x=>x.id!==obj.id);state.selectedObject=state.doc.objects[0]?.id||null;state.selectedRegion=null;markDirty();renderAll()}
    function selectObject(id){state.selectedObject=id;state.selectedRegion=null;state.tool=null;renderAll()}
    function selectRegion(objectId,regionId){state.selectedObject=objectId;state.selectedRegion=regionId;state.tool=null;renderAll();const region=currentRegion();document.querySelector(`.pdf-page[data-page="${region?.page}"]`)?.scrollIntoView({behavior:'smooth',block:'center'})}

    function toolAllowed(tool,obj){return obj&&(obj.type==='field'?tool==='field':tool!=='field')}
    function setTool(tool){const obj=currentObject();if(!toolAllowed(tool,obj))return;state.tool=state.tool===tool?null:tool;renderTools();setStatus(state.tool?`Выделите прямоугольник: ${kindName[state.tool]}`:'Инструмент отменён')}
    function renderTools(){const obj=currentObject(),region=currentRegion();document.querySelectorAll('[data-tool]').forEach(button=>{button.disabled=!toolAllowed(button.dataset.tool,obj);button.classList.toggle('active',state.tool===button.dataset.tool)});const grid=region&&['table_header','table_rows'].includes(region.kind);$('addColumn').disabled=!grid;$('addRow').disabled=!region||region.kind!=='table_rows'}

    function renderPdf(){const view=$('pdfView');view.replaceChildren();view.style.setProperty('--zoom',state.zoom);if(!state.doc){view.innerHTML='<div class="empty">Откройте PDF</div>';return}for(let pageNo=1;pageNo<=state.doc.pageCount;pageNo++){const page=document.createElement('div');page.className='pdf-page';page.dataset.page=pageNo;page.style.width=`${state.zoom*100}%`;const image=document.createElement('img');image.src=`/api/pdf/page/${pageNo}?source=${encodeURIComponent(state.source)}`;image.alt=`Страница ${pageNo}`;const overlay=document.createElement('div');overlay.className='overlay';overlay.dataset.page=pageNo;overlay.addEventListener('pointerdown',startDraw);for(const obj of state.doc.objects)for(const region of obj.regions||[])if(region.page===pageNo)overlay.append(renderRegion(obj,region));const number=document.createElement('span');number.className='page-no';number.textContent=`${pageNo} / ${state.doc.pageCount}`;page.append(image,overlay,number);view.append(page)}$('zoomLabel').textContent=`${Math.round(state.zoom*100)}%`}
    function renderRegion(obj,region){const node=document.createElement('div');node.className=`region ${region.status||'pending'}${region.id===state.selectedRegion?' selected':''}`;node.style.left=`${region.rect.x*100}%`;node.style.top=`${region.rect.y*100}%`;node.style.width=`${region.rect.w*100}%`;node.style.height=`${region.rect.h*100}%`;node.title=region.error||`${obj.name}: ${kindName[region.kind]}`;node.onclick=event=>{event.stopPropagation();selectRegion(obj.id,region.id)};const label=document.createElement('span');label.className='region-label';label.textContent=`${obj.name} · ${kindName[region.kind]}`;const actions=document.createElement('span');actions.className='region-actions';const ocr=document.createElement('button');ocr.textContent='▶';ocr.title='Распознать область';ocr.onclick=event=>{event.stopPropagation();runOcr(obj.id,region.id)};const remove=document.createElement('button');remove.textContent='×';remove.title='Удалить область';remove.onclick=event=>{event.stopPropagation();obj.regions=obj.regions.filter(x=>x.id!==region.id);if(state.selectedRegion===region.id)state.selectedRegion=null;markDirty();renderAll()};actions.append(ocr,remove);node.append(label,actions);if(['table_header','table_rows'].includes(region.kind)){for(const cut of region.grid?.columns||[])node.append(gridLine('v',cut,region));if(region.kind==='table_rows')for(const cut of region.grid?.rows||[])node.append(gridLine('h',cut,region))}return node}
    function gridLine(axis,value,region){const line=document.createElement('span');line.className=`grid-line ${axis}`;line.style[axis==='v'?'left':'top']=`${value*100}%`;line.onpointerdown=event=>{event.stopPropagation();event.preventDefault();const host=line.parentElement,move=e=>{const box=host.getBoundingClientRect();let next=axis==='v'?(e.clientX-box.left)/box.width:(e.clientY-box.top)/box.height;next=Math.max(.03,Math.min(.97,next));const list=axis==='v'?region.grid.columns:region.grid.rows;list[list.indexOf(value)]=Number(next.toFixed(4));markDirty();line.style[axis==='v'?'left':'top']=`${next*100}%`};const up=()=>{window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',up);renderAll()};window.addEventListener('pointermove',move);window.addEventListener('pointerup',up)};line.ondblclick=event=>{event.stopPropagation();const list=axis==='v'?region.grid.columns:region.grid.rows;list.splice(list.indexOf(value),1);markDirty();renderAll()};return line}
    function startDraw(event){if(!state.tool||event.button!==0)return;const obj=currentObject();if(!obj)return;event.preventDefault();const overlay=event.currentTarget,box=overlay.getBoundingClientRect(),startX=(event.clientX-box.left)/box.width,startY=(event.clientY-box.top)/box.height;const ghost=document.createElement('div');ghost.className='region pending';overlay.append(ghost);const move=e=>{const x=Math.max(0,Math.min(1,(e.clientX-box.left)/box.width)),y=Math.max(0,Math.min(1,(e.clientY-box.top)/box.height));const left=Math.min(startX,x),top=Math.min(startY,y),w=Math.abs(x-startX),h=Math.abs(y-startY);Object.assign(ghost.style,{left:`${left*100}%`,top:`${top*100}%`,width:`${w*100}%`,height:`${h*100}%`});state.draw={left,top,w,h}};const up=()=>{window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',up);ghost.remove();const d=state.draw;state.draw=null;if(!d||d.w<.01||d.h<.01)return;const region={id:uid(),kind:state.tool,page:Number(overlay.dataset.page),rect:{x:+d.left.toFixed(5),y:+d.top.toFixed(5),w:+d.w.toFixed(5),h:+d.h.toFixed(5)},grid:{columns:[],rows:[]},properties:{useLlm:false,prompt:'',column:'Группа'},status:'pending',output:null,error:null};obj.regions.push(region);state.selectedRegion=region.id;state.tool=null;markDirty();renderAll();runOcr(obj.id,region.id)};window.addEventListener('pointermove',move);window.addEventListener('pointerup',up)}
    function addCut(axis){const region=currentRegion();if(!region)return;const list=axis==='columns'?region.grid.columns:region.grid.rows;const edges=[0,...list.sort((a,b)=>a-b),1];let best=[0,1];for(let i=0;i<edges.length-1;i++)if(edges[i+1]-edges[i]>best[1]-best[0])best=[edges[i],edges[i+1]];list.push(Number(((best[0]+best[1])/2).toFixed(4)));markDirty();renderAll()}

    function renderObjects(){const list=$('objectList');list.replaceChildren();if(!state.doc?.objects.length){list.innerHTML='<div class="empty">Создайте поле или таблицу</div>';return}for(const obj of state.doc.objects){const node=document.createElement('div');node.className=`object${obj.id===state.selectedObject?' active':''}`;node.onclick=()=>selectObject(obj.id);const head=document.createElement('div');head.className='object-head';head.innerHTML=`<span>${obj.type==='field'?'Aa':'▦'}</span><span class="object-name"></span><span class="badge">${obj.regions?.length||0}</span>`;head.querySelector('.object-name').textContent=obj.name;node.append(head);const regions=document.createElement('div');regions.className='region-list';for(const region of obj.regions||[]){const row=document.createElement('div');row.className='region-row';row.innerHTML=`<span class="dot ${region.status||'pending'}"></span><span>стр. ${region.page} · ${kindName[region.kind]}</span>`;row.onclick=event=>{event.stopPropagation();selectRegion(obj.id,region.id)};regions.append(row)}node.append(regions);list.append(node)}}
    function renderProperties(){const obj=currentObject(),region=currentRegion();$('objectName').disabled=!obj;$('deleteObject').disabled=!obj;$('objectName').value=obj?.name||'';$('useLlm').disabled=!region;$('useLlm').checked=!!region?.properties?.useLlm;$('prompt').disabled=!region;$('prompt').value=region?.properties?.prompt||'';const isGroup=region?.kind==='group_value';document.querySelector('.group-column').hidden=!isGroup;$('groupColumn').value=region?.properties?.column||'Группа'}

    function renderEditor(){const root=$('editor');root.replaceChildren();if(!state.doc?.objects.length){root.innerHTML='<div class="empty">Добавьте объекты и области</div>';return}for(const obj of state.doc.objects){const card=document.createElement('section');card.className='card';const head=document.createElement('div');head.className='card-head';head.innerHTML=`<strong class="grow"></strong><span class="badge">${obj.type==='field'?'поле':'таблица'}</span>`;head.querySelector('strong').textContent=obj.name;const body=document.createElement('div');body.className='card-body';if(obj.type==='field'){const area=document.createElement('textarea');area.className='value-editor';area.value=obj.result?.value||'';area.placeholder='Результат OCR';area.oninput=()=>{obj.result.value=area.value;obj.status='modified';for(const region of obj.regions||[])if(region.status==='recognized')region.status='modified';markDirty();renderObjects();renderPdf()};body.append(area)}else body.append(renderTable(obj));card.append(head,body);root.append(card)}const preview=document.createElement('section');preview.className='card';preview.innerHTML='<div class="card-head"><strong>Итоговый JSON · data</strong></div>';const pre=document.createElement('pre');pre.className='card-body json-preview';pre.textContent=JSON.stringify(materializedData(),null,2);preview.append(pre);root.append(preview)}
    function renderTable(obj){const wrap=document.createElement('div');wrap.className='table-wrap';const table=document.createElement('table');table.className='data-table';const columns=obj.result?.columns||[],rows=obj.result?.rows||[];const head=document.createElement('thead'),tr=document.createElement('tr');columns.forEach((value,index)=>{const th=document.createElement('th'),input=document.createElement('input');input.value=value;input.placeholder=`Столбец ${index+1}`;input.oninput=()=>{columns[index]=input.value;modified(obj)};th.append(input);tr.append(th)});const plus=document.createElement('th'),add=document.createElement('button');add.className='secondary icon';add.textContent='+';add.onclick=()=>{columns.push(`Столбец ${columns.length+1}`);rows.forEach(row=>row.push(''));modified(obj);renderAll()};plus.append(add);tr.append(plus);head.append(tr);table.append(head);const body=document.createElement('tbody');rows.forEach((row,rowIndex)=>{const tr=document.createElement('tr');columns.forEach((_,columnIndex)=>{const td=document.createElement('td'),input=document.createElement('input');input.value=row[columnIndex]||'';input.oninput=()=>{row[columnIndex]=input.value;modified(obj)};td.append(input);tr.append(td)});const td=document.createElement('td'),del=document.createElement('button');del.className='danger icon';del.textContent='×';del.onclick=()=>{rows.splice(rowIndex,1);modified(obj);renderAll()};td.append(del);tr.append(td);body.append(tr)});table.append(body);wrap.append(table);const addRow=document.createElement('button');addRow.className='secondary add-row';addRow.textContent='+ строка';addRow.onclick=()=>{rows.push(columns.map(()=>''));modified(obj);renderAll()};wrap.append(addRow);return wrap}
    function modified(obj){obj.status='modified';for(const region of obj.regions||[])if(region.status==='recognized')region.status='modified';markDirty()}
    function materializedData(){const data={};for(const obj of state.doc.objects){if(obj.type==='field')data[obj.key||obj.name]=obj.result?.value||'';else{const columns=obj.result?.columns||[];data[obj.key||obj.name]={columns:[...columns],rows:(obj.result?.rows||[]).map(row=>Object.fromEntries(columns.map((name,i)=>[name||`Столбец ${i+1}`,row[i]||''])))}}}return data}
    function renderAll(){if(state.doc)state.doc.data=materializedData();renderTools();renderObjects();renderProperties();renderEditor();renderPdf()}

    async function saveDocument(silent=false){if(!state.doc)return;try{state.doc.data=materializedData();const result=await api('/api/document',{method:'PUT',body:JSON.stringify({source:state.source,document:state.doc})});state.doc=result.document;state.dirty=false;$('saveDocument').disabled=true;if(!silent)toast(`Сохранено рядом с PDF: ${result.path}`);setStatus('Разметка и JSON сохранены')}catch(error){toast(error.message,true)}}
    async function runOcr(objectId,regionId){try{await saveDocument(true);const obj=state.doc.objects.find(x=>x.id===objectId),region=obj.regions.find(x=>x.id===regionId);region.status='queued';renderAll();const result=await api('/api/ocr',{method:'POST',body:JSON.stringify({source:state.source,objectId,regionId})});state.tasks.add(result.taskId);pollTask(result.taskId)}catch(error){toast(error.message,true)}}
    async function pollTask(taskId){try{const result=await api(`/api/tasks/${taskId}`);if(result.state==='done'){state.tasks.delete(taskId);state.doc=result.document;state.dirty=false;renderAll();setStatus('OCR области завершён');return}if(result.state==='failed')throw new Error(result.error||'Ошибка OCR');setTimeout(()=>pollTask(taskId),700)}catch(error){state.tasks.delete(taskId);toast(error.message,true);if(state.source){const fresh=await api(`/api/document?source=${encodeURIComponent(state.source)}`);state.doc=fresh.document;renderAll()}}}

    async function loadTemplates(){try{const catalog=await api(`/api/templates?source=${encodeURIComponent(state.source)}`),select=$('templateSelect');select.innerHTML='<option value="">Без шаблона</option>';for(const template of catalog.templates||[]){const option=document.createElement('option');option.value=template.id;option.textContent=template.name;select.append(option)}if(state.doc.templateId)select.value=state.doc.templateId}catch(error){toast(error.message,true)}}
    async function applyTemplate(){const id=$('templateSelect').value;if(!id||!confirm('Текущие объекты разметки будут заменены шаблоном. Продолжить?'))return;try{const result=await api('/api/templates/apply',{method:'POST',body:JSON.stringify({source:state.source,templateId:id})});state.doc=result.document;state.selectedObject=state.doc.objects[0]?.id||null;state.selectedRegion=null;renderAll();toast('Шаблон применён')}catch(error){toast(error.message,true)}}
    async function saveTemplate(){if(!state.doc)return;$('templateName').value='';$('templateDialog').showModal();$('templateName').focus()}
    async function confirmTemplate(){try{const catalog=await api('/api/templates',{method:'POST',body:JSON.stringify({source:state.source,name:$('templateName').value,document:state.doc})});$('templateDialog').close();await loadTemplates();$('templateSelect').value=catalog.templates.at(-1).id;toast('Шаблон сохранён рядом с PDF')}catch(error){toast(error.message,true)}}

    $('openFile').onclick=openDialog;$('openSource').onclick=() => openSource($('sourceInput').value);$('sourceInput').onkeydown=e=>{if(e.key==='Enter')openSource(e.currentTarget.value)};
    $('addField').onclick=()=>state.doc&&addObject('field');$('addTable').onclick=()=>state.doc&&addObject('table');$('nameCancel').onclick=()=>$('nameDialog').close();$('nameOk').onclick=confirmObject;$('newName').onkeydown=e=>{if(e.key==='Enter')confirmObject()};
    document.querySelectorAll('[data-tool]').forEach(button=>button.onclick=()=>setTool(button.dataset.tool));$('addColumn').onclick=()=>addCut('columns');$('addRow').onclick=()=>addCut('rows');$('deleteObject').onclick=deleteObject;
    $('objectName').oninput=e=>{const obj=currentObject();if(obj){obj.name=e.target.value;obj.key=e.target.value;markDirty();renderObjects();renderEditor();renderPdf()}};
    $('useLlm').onchange=e=>{const region=currentRegion();if(region){region.properties.useLlm=e.target.checked;markDirty()}};$('prompt').oninput=e=>{const region=currentRegion();if(region){region.properties.prompt=e.target.value;markDirty()}};$('groupColumn').oninput=e=>{const region=currentRegion();if(region){region.properties.column=e.target.value;markDirty()}};
    $('saveDocument').onclick=()=>saveDocument();$('exportJson').onclick=()=>{if(state.source)location.href=`/api/export?source=${encodeURIComponent(state.source)}`};$('applyTemplate').onclick=applyTemplate;$('saveTemplate').onclick=saveTemplate;$('templateCancel').onclick=()=>$('templateDialog').close();$('templateOk').onclick=confirmTemplate;
    $('zoomIn').onclick=()=>{state.zoom=Math.min(1.8,state.zoom+.1);renderPdf()};$('zoomOut').onclick=()=>{state.zoom=Math.max(.6,state.zoom-.1);renderPdf()};
    window.addEventListener('beforeunload',event=>{if(state.dirty){event.preventDefault();event.returnValue=''}});
    const query=new URLSearchParams(location.search),initial=query.get('source')||query.get('path')||query.get('blob');if(initial){$('sourceInput').value=initial;openSource(initial)}
  </script>
</body>
</html>
