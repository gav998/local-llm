<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Digitizer</title>
  <style>
    :root{color-scheme:light;--bg:#eef1f5;--panel:#fff;--line:#d5dbe4;--ink:#172033;--muted:#667085;--blue:#2864dc;--green:#16845b;--yellow:#c88900;--red:#c93f4b;--violet:#7255c6}
    *{box-sizing:border-box}body{margin:0;height:100vh;overflow:hidden;background:var(--bg);color:var(--ink);font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
    button,input,select,textarea{font:inherit}button{border:1px solid var(--line);border-radius:7px;background:#fff;padding:7px 10px;color:var(--ink);cursor:pointer}button:hover{border-color:#9ba8ba}button:disabled{opacity:.5;cursor:default}.primary{background:var(--blue);border-color:var(--blue);color:#fff}.danger{color:var(--red)}
    header{height:58px;display:flex;align-items:center;gap:8px;padding:9px 14px;background:var(--panel);border-bottom:1px solid var(--line)}header strong{font-size:17px;margin-right:4px}#sourceInput{min-width:180px;flex:1;max-width:620px;padding:8px 10px;border:1px solid var(--line);border-radius:7px}#status{margin-left:auto;color:var(--muted);white-space:nowrap}.dirty{color:var(--yellow)!important}
    main{display:grid;grid-template-columns:minmax(420px,56%) minmax(380px,44%);height:calc(100vh - 58px)}.pdf-pane,.side{min-width:0;overflow:hidden}.pdf-pane{position:relative;border-right:1px solid var(--line)}
    .pdf-toolbar{height:42px;display:flex;align-items:center;gap:6px;padding:5px 10px;background:#f8fafc;border-bottom:1px solid var(--line)}.pdf-toolbar span{color:var(--muted);margin-right:auto}.pdf-scroll{height:calc(100% - 42px);overflow:auto;padding:18px;background:#cfd5dd}
    .page{position:relative;margin:0 auto 18px;max-width:980px;background:#fff;box-shadow:0 3px 18px #4b556344;user-select:none}.page img{display:block;width:100%;height:auto;pointer-events:none}.overlay{position:absolute;inset:0;cursor:crosshair}.page-number{position:absolute;right:6px;bottom:5px;background:#111a;color:#fff;padding:2px 6px;border-radius:4px;pointer-events:none}
    .region{position:absolute;border:2px solid var(--yellow);background:#c8890014;cursor:move;min-width:5px;min-height:5px}.region.recognized{border-color:var(--green);background:#16845b10}.region.modified{border-color:var(--red);background:#c93f4b10}.region.error{border-color:var(--red);background:#c93f4b1c}.region.queued,.region.running{border-color:var(--yellow);animation:pulse 1s infinite alternate}.region.selected{outline:3px solid #2864dc55;z-index:4}.region-label{position:absolute;left:-2px;top:-24px;max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:#182235;color:#fff;border-radius:5px;padding:2px 6px;font-size:12px;pointer-events:none}.handle{position:absolute;width:12px;height:12px;right:-7px;bottom:-7px;border:2px solid #fff;border-radius:50%;background:var(--blue);cursor:nwse-resize}.grid-line{position:absolute;background:#7255c6;z-index:2}.grid-line.x{top:0;bottom:0;width:2px;cursor:ew-resize}.grid-line.y{left:0;right:0;height:2px;cursor:ns-resize}@keyframes pulse{to{opacity:.48}}
    .draft{position:absolute;border:2px dashed var(--blue);background:#2864dc18;pointer-events:none}
    .side{display:grid;grid-template-rows:minmax(250px,58%) minmax(180px,42%);background:var(--panel)}.objects-pane,.markdown-pane{min-height:0;display:flex;flex-direction:column}.objects-pane{border-bottom:1px solid var(--line)}.pane-title{height:42px;display:flex;align-items:center;gap:7px;padding:6px 10px;background:#f8fafc;border-bottom:1px solid var(--line)}.pane-title strong{margin-right:auto}.object-list{overflow:auto;padding:10px}
    .empty{padding:34px 15px;text-align:center;color:var(--muted)}.object-card{border:1px solid var(--line);border-radius:9px;margin-bottom:10px;overflow:hidden;background:#fff}.object-head{display:flex;align-items:center;gap:6px;padding:7px 9px;background:#f6f8fb;border-bottom:1px solid var(--line)}.object-head strong{margin-right:auto}.mini{padding:3px 7px;font-size:12px}.region-card{padding:9px;border-bottom:1px solid #e7ebf0}.region-card:last-child{border-bottom:0}.region-card.active{box-shadow:inset 3px 0 var(--blue)}.region-top{display:flex;align-items:center;gap:6px;margin-bottom:7px}.region-top b{margin-right:auto}.badge{font-size:11px;border-radius:999px;padding:2px 7px;background:#eef2f7;color:var(--muted)}.badge.recognized{color:var(--green);background:#e7f7f0}.badge.modified,.badge.error{color:var(--red);background:#fff0f1}.badge.running,.badge.queued{color:#9a6a00;background:#fff7da}
    textarea.value{display:block;width:100%;min-height:66px;resize:vertical;border:1px solid var(--line);border-radius:6px;padding:7px;background:#fff}.table-edit{width:100%;border-collapse:collapse}.table-edit td{border:1px solid var(--line);padding:0;vertical-align:top;position:relative}.table-edit textarea{border:0;resize:vertical;display:block;width:100%;min-height:48px;padding:6px;padding-right:29px}.cell-ai{position:absolute;right:3px;top:3px;padding:2px 6px;color:var(--violet)}.table-controls{display:flex;gap:5px;margin:0 0 7px;flex-wrap:wrap}.error-text{color:var(--red);font-size:12px;margin-top:5px;white-space:pre-wrap}
    #markdownEditor{flex:1;min-height:0;width:100%;resize:none;border:0;padding:12px;font:12px/1.45 ui-monospace,SFMono-Regular,Consolas,monospace;tab-size:2;outline:none}.raw-error{color:var(--red);font-size:12px;max-width:52%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    dialog{border:0;border-radius:12px;padding:0;box-shadow:0 18px 60px #11182755;min-width:390px;max-width:92vw}dialog::backdrop{background:#11182766}.dialog-body{padding:18px}.dialog-body h2{font-size:18px;margin:0 0 14px}.form-row{margin:10px 0}.form-row label{display:block;font-weight:600;margin-bottom:5px}.form-row select,.form-row input{width:100%;padding:8px;border:1px solid var(--line);border-radius:7px}.grid-size{display:grid;grid-template-columns:1fr 1fr;gap:8px}.dialog-actions{display:flex;justify-content:flex-end;gap:7px;padding:12px 18px;background:#f7f9fb;border-top:1px solid var(--line)}
    .toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);padding:9px 14px;border-radius:8px;background:#182235;color:#fff;z-index:20;box-shadow:0 4px 20px #1115}.toast.error{background:var(--red)}
    @media(max-width:900px){main{grid-template-columns:1fr}.pdf-pane{display:none}.side{grid-template-rows:58% 42%}}
  </style>
</head>
<body>
  <header>
    <strong>Digitizer</strong>
    <button id="openFile">Открыть PDF</button>
    <input id="sourceInput" placeholder="Путь к PDF или URL">
    <button id="openSource">Открыть</button>
    <button id="save" class="primary" disabled>Сохранить</button>
    <span id="status">Откройте PDF</span>
  </header>
  <main>
    <section class="pdf-pane">
      <div class="pdf-toolbar"><span>Выделите прямоугольник мышью</span><button id="zoomOut">−</button><button id="zoomIn">＋</button></div>
      <div id="pdf" class="pdf-scroll"></div>
    </section>
    <section class="side">
      <div class="objects-pane">
        <div class="pane-title"><strong>Объекты</strong><button id="addHint" disabled>Как добавить</button></div>
        <div id="objects" class="object-list"><div class="empty">Сначала откройте PDF</div></div>
      </div>
      <div class="markdown-pane">
        <div class="pane-title"><strong>Markdown — единственный файл данных</strong><span id="rawError" class="raw-error"></span><button id="applyMarkdown">Применить</button></div>
        <textarea id="markdownEditor" spellcheck="false" placeholder="Разметка появится здесь"></textarea>
      </div>
    </section>
  </main>

  <dialog id="assignDialog">
    <div class="dialog-body">
      <h2>Назначить выделенную область</h2>
      <div class="form-row"><label for="assignObject">Объект</label><select id="assignObject"></select></div>
      <div class="form-row" id="typeRow"><label for="assignType">Тип нового объекта</label><select id="assignType"></select></div>
      <div class="form-row"><label for="assignField">Тип поля</label><select id="assignField"></select></div>
      <div id="gridSize" class="grid-size">
        <div class="form-row"><label for="gridColumns">Столбцов</label><input id="gridColumns" type="number" min="1" max="20" value="3"></div>
        <div class="form-row"><label for="gridRows">Строк в блоке</label><input id="gridRows" type="number" min="1" max="100" value="3"></div>
      </div>
    </div>
    <div class="dialog-actions"><button id="assignCancel">Отмена</button><button id="assignOk" class="primary">Создать и распознать</button></div>
  </dialog>

  <script>
    const $=id=>document.getElementById(id);
    const STATUS={pending:'Ожидает OCR',queued:'В очереди',running:'Распознаётся',recognized:'Распознано',modified:'Изменено',error:'Ошибка'};
    const state={config:null,source:'',name:'',pageCount:0,objects:[],selected:null,draft:null,drag:null,zoom:1,dirty:false,rawDirty:false,busy:0};
    let keyCounter=0;
    const key=()=>`r${++keyCounter}`;

    async function api(url,options={}){const response=await fetch(url,{headers:{'Content-Type':'application/json'},...options});if(!response.ok){let message=response.statusText;try{message=(await response.json()).detail||message}catch{}throw new Error(message)}return response.json()}
    function toast(message,error=false){const node=document.createElement('div');node.className=`toast${error?' error':''}`;node.textContent=message;document.body.append(node);setTimeout(()=>node.remove(),3500)}
    function setStatus(message){$('status').textContent=message;$('status').classList.toggle('dirty',state.dirty)}
    function typeInfo(type){return state.config?.types?.[type]||{name:type,fields:{}}}
    function fieldInfo(obj,field){return typeInfo(obj.type).fields[field]||{name:field,kind:'text'} }
    function decorate(objects){for(const obj of objects){obj._key=obj._key||key();for(const region of obj.regions||[]){region._key=region._key||key();if(region.kind==='table')ensureCells(region)}}return objects}
    function equalCuts(count){return Array.from({length:count+1},(_,i)=>Number((i/count).toFixed(6)))}
    function statusMatrix(rows,columns,current=[]){return Array.from({length:rows},(_,r)=>Array.from({length:columns},(_,c)=>current?.[r]?.[c]||'pending'))}
    function splitTableRow(line){let value=line.trim();if(value.startsWith('|'))value=value.slice(1);if(value.endsWith('|')&&!value.endsWith('\\|'))value=value.slice(0,-1);const cells=[],part=[];let escaped=false;for(const char of value){if(escaped){part.push(char);escaped=false}else if(char==='\\'){escaped=true}else if(char==='|'){cells.push(part.join('').trim());part.length=0}else part.push(char)}if(escaped)part.push('\\');cells.push(part.join('').trim());return cells}
    function parseTable(text,rows,columns){const lines=String(text||'').split(/\r?\n/),values=[];let start=-1;for(let i=0;i<lines.length-1;i++){const separator=splitTableRow(lines[i+1]);if(separator.length===columns&&separator.every(x=>/^:?-{3,}:?$/.test(x))){start=i+2;break}}if(start>=0)for(const line of lines.slice(start)){if(!line.trim())break;const cells=splitTableRow(line);values.push(Array.from({length:columns},(_,c)=>cells[c]||''));if(values.length===rows)break}return Array.from({length:rows},(_,r)=>Array.from({length:columns},(_,c)=>values[r]?.[c]||''))}
    function escapeCell(value){return String(value??'').replace(/\r?\n/g,' ').replace(/\\/g,'\\\\').replace(/\|/g,'\\|').trim()}
    function tableText(region){const cells=region._cells||[],columns=region.grid.x.length-1;const headers=Array.from({length:columns},(_,i)=>String(i+1));return [`| ${headers.join(' | ')} |`,`| ${headers.map(()=> '---').join(' | ')} |`,...cells.map(row=>`| ${row.map(escapeCell).join(' | ')} |`)].join('\n')}
    function ensureCells(region){const rows=region.grid.y.length-1,columns=region.grid.x.length-1;const current=region._cells||parseTable(region.text,rows,columns);region._cells=Array.from({length:rows},(_,r)=>Array.from({length:columns},(_,c)=>current?.[r]?.[c]||''));region.grid.statuses=statusMatrix(rows,columns,region.grid.statuses);region.text=tableText(region)}
    function cleanRegion(region){const value={field:region.field,page:Number(region.page),rect:region.rect.map(x=>Number(Number(x).toFixed(6))),rotation:Number(region.rotation||0),status:region.status||'pending'};if(value.status==='error'&&region.error)value.error=String(region.error);if(region.kind==='table'){ensureCells(region);value.grid={x:region.grid.x.map(Number),y:region.grid.y.map(Number),statuses:region.grid.statuses}}return value}
    function serialize(){const chunks=state.objects.map(obj=>{const lines=[`<!-- digitizer:object ${JSON.stringify({type:obj.type})} -->`];for(const region of obj.regions){if(region.kind==='table')region.text=tableText(region);lines.push(`<!-- digitizer:${region.kind} ${JSON.stringify(cleanRegion(region))} -->`);if(region.text)lines.push(String(region.text).replace(/^\n+|\n+$/g,''))}return lines.join('\n')});return chunks.length?chunks.join('\n\n').replace(/\s+$/,'')+'\n':''}
    function parseMarkdown(markdown){const regex=/<!--[ \t]*digitizer:(object|region|table)[ \t]+(\{[^\r\n]*\})[ \t]*-->/gi,matches=[...markdown.matchAll(regex)];if(!matches.length){if(markdown.trim())throw new Error('Нет маркеров digitizer');return []}if(markdown.slice(0,matches[0].index).trim())throw new Error('Текст до первого маркера не поддерживается');const objects=[];let current=null;matches.forEach((match,index)=>{const kind=match[1].toLowerCase(),meta=JSON.parse(match[2]),end=index+1<matches.length?matches[index+1].index:markdown.length,content=markdown.slice(match.index+match[0].length,end).replace(/^[\r\n]+|[\r\n]+$/g,'');if(kind==='object'){if(content.trim())throw new Error('После object ожидается область');if(!state.config.types[meta.type])throw new Error(`Неизвестный тип ${meta.type}`);current={type:meta.type,regions:[],_key:key()};objects.push(current);return}if(!current)throw new Error('Область до объекта');const info=fieldInfo(current,meta.field),expected=info.kind==='grid'?'table':'region';if(kind!==expected)throw new Error(`Полю ${meta.field} нужен маркер ${expected}`);const region={...meta,kind,text:content,_key:key()};if(['queued','running'].includes(region.status))region.status='pending';if(kind==='table')ensureCells(region);current.regions.push(region)});return objects}
    function syncRaw(){if(state.rawDirty)return;$('markdownEditor').value=serialize();$('rawError').textContent=''}
    function changed(message='Есть несохранённые изменения'){state.dirty=true;$('save').disabled=false;setStatus(message);syncRaw()}

    async function loadConfig(){state.config=await api('/api/config')}
    async function openSource(value){value=String(value||'').trim();if(!value)return;try{setStatus('Открываю PDF…');const result=await api(`/api/document?source=${encodeURIComponent(value)}`);state.source=result.source;state.name=result.name;state.pageCount=result.pageCount;state.objects=decorate(result.objects||[]);state.selected=null;state.dirty=false;state.rawDirty=false;$('sourceInput').value=result.source;$('save').disabled=true;$('addHint').disabled=false;syncRaw();renderAll();setStatus(`${result.name} · ${result.pageCount} стр.`)}catch(error){setStatus('Ошибка открытия');toast(error.message,true)}}
    async function openDialog(){try{const result=await api('/api/open/dialog',{method:'POST',body:'{}'});if(!result.cancelled)openSource(result.source)}catch(error){toast(error.message,true)}}
    async function save(silent=false){if(!state.source)return false;try{if(state.rawDirty&&!applyMarkdown())return false;setStatus('Сохраняю…');const markdown=serialize(),result=await api('/api/document',{method:'PUT',body:JSON.stringify({source:state.source,markdown})});state.dirty=false;state.rawDirty=false;$('save').disabled=true;$('markdownEditor').value=result.markdown;setStatus(`${state.name} · сохранено`);if(!silent)toast(`Сохранено: ${result.path}`);return true}catch(error){setStatus('Ошибка сохранения');toast(error.message,true);return false}}
    function applyMarkdown(){try{state.objects=decorate(parseMarkdown($('markdownEditor').value));state.rawDirty=false;state.selected=null;$('rawError').textContent='';renderPdf();renderObjects();changed('Markdown применён, сохраните документ');return true}catch(error){$('rawError').textContent=error.message;toast(error.message,true);return false}}

    function renderAll(){renderPdf();renderObjects();syncRaw()}
    function renderPdf(){const root=$('pdf');root.innerHTML='';if(!state.source){root.innerHTML='<div class="empty">PDF не открыт</div>';return}for(let page=1;page<=state.pageCount;page++){const pageNode=document.createElement('div');pageNode.className='page';pageNode.style.width=`${Math.round(state.zoom*100)}%`;const image=document.createElement('img');image.src=`/api/pdf/page/${page}?source=${encodeURIComponent(state.source)}`;image.alt=`Страница ${page}`;const overlay=document.createElement('div');overlay.className='overlay';overlay.dataset.page=page;overlay.onpointerdown=startDraw;for(const obj of state.objects)for(const region of obj.regions)if(region.page===page)overlay.append(regionNode(obj,region));if(state.draft?.page===page){const draft=document.createElement('div');draft.className='draft';place(draft,state.draft.rect);overlay.append(draft)}const number=document.createElement('span');number.className='page-number';number.textContent=page;pageNode.append(image,overlay,number);root.append(pageNode)}}
    function place(node,rect){node.style.left=`${rect[0]*100}%`;node.style.top=`${rect[1]*100}%`;node.style.width=`${rect[2]*100}%`;node.style.height=`${rect[3]*100}%`}
    function regionNode(obj,region){const node=document.createElement('div');node.className=`region ${region.status}${state.selected===region._key?' selected':''}`;node.dataset.key=region._key;place(node,region.rect);node.title=region.error||STATUS[region.status];node.onpointerdown=event=>startRegionDrag(event,obj,region);node.onclick=event=>{event.stopPropagation();state.selected=region._key;renderAll();scrollCard(region._key)};const label=document.createElement('span');label.className='region-label';label.textContent=`${fieldInfo(obj,region.field).name} · ${STATUS[region.status]||region.status}`;node.append(label);if(region.kind==='table'){region.grid.x.slice(1,-1).forEach((cut,index)=>{const line=document.createElement('i');line.className='grid-line x';line.style.left=`${cut*100}%`;line.dataset.axis='x';line.dataset.index=index+1;node.append(line)});region.grid.y.slice(1,-1).forEach((cut,index)=>{const line=document.createElement('i');line.className='grid-line y';line.style.top=`${cut*100}%`;line.dataset.axis='y';line.dataset.index=index+1;node.append(line)})}const handle=document.createElement('i');handle.className='handle';node.append(handle);return node}
    function pointerPosition(event,node){const box=node.getBoundingClientRect();return[(event.clientX-box.left)/box.width,(event.clientY-box.top)/box.height]}
    function startDraw(event){if(event.button!==0||event.target!==event.currentTarget||state.busy)return;const overlay=event.currentTarget,[x,y]=pointerPosition(event,overlay),draftNode=document.createElement('div');draftNode.className='draft';overlay.append(draftNode);state.drag={mode:'draw',overlay,draftNode,page:Number(overlay.dataset.page),start:[x,y]};overlay.setPointerCapture(event.pointerId);overlay.onpointermove=movePointer;overlay.onpointerup=endPointer;event.preventDefault()}
    function startRegionDrag(event,obj,region){if(event.button!==0||state.busy)return;event.stopPropagation();const node=event.currentTarget,overlay=node.parentElement,[x,y]=pointerPosition(event,overlay),line=event.target.closest('.grid-line'),mode=line?'grid':event.target.closest('.handle')?'resize':'move';state.selected=region._key;state.drag={mode,node,line,overlay,obj,region,start:[x,y],rect:[...region.rect],axis:line?.dataset.axis,index:Number(line?.dataset.index)};node.setPointerCapture(event.pointerId);node.onpointermove=movePointer;node.onpointerup=endPointer;event.preventDefault()}
    function movePointer(event){const drag=state.drag;if(!drag)return;const [x,y]=pointerPosition(event,drag.overlay),dx=x-drag.start[0],dy=y-drag.start[1];if(drag.mode==='draw'){const x0=Math.max(0,Math.min(drag.start[0],x)),y0=Math.max(0,Math.min(drag.start[1],y)),x1=Math.min(1,Math.max(drag.start[0],x)),y1=Math.min(1,Math.max(drag.start[1],y));state.draft={page:drag.page,rect:[x0,y0,x1-x0,y1-y0]};place(drag.draftNode,state.draft.rect);return}if(drag.mode==='grid'){const region=drag.region,rect=region.rect,relative=drag.axis==='x'?(x-rect[0])/rect[2]:(y-rect[1])/rect[3],cuts=region.grid[drag.axis],minimum=.02;cuts[drag.index]=Math.max(cuts[drag.index-1]+minimum,Math.min(cuts[drag.index+1]-minimum,relative));drag.line.style[drag.axis==='x'?'left':'top']=`${cuts[drag.index]*100}%`;return}let [rx,ry,rw,rh]=drag.rect;if(drag.mode==='move'){rx=Math.max(0,Math.min(1-rw,rx+dx));ry=Math.max(0,Math.min(1-rh,ry+dy))}else{rw=Math.max(.01,Math.min(1-rx,rw+dx));rh=Math.max(.01,Math.min(1-ry,rh+dy))}drag.region.rect=[rx,ry,rw,rh];place(drag.node,drag.region.rect)}
    function endPointer(event){const drag=state.drag;state.drag=null;if(!drag)return;if(drag.mode==='draw'){const draft=state.draft;if(draft&&draft.rect[2]>.005&&draft.rect[3]>.005)showAssign();else{state.draft=null;renderPdf()}return}drag.region.status='modified';delete drag.region.error;ensureCellsIfTable(drag.region);changed('Геометрия изменена; повторите OCR');renderAll()}
    function ensureCellsIfTable(region){if(region.kind==='table')ensureCells(region)}

    function showAssign(){const objectSelect=$('assignObject');objectSelect.innerHTML='<option value="">Новый объект</option>';state.objects.forEach(obj=>{const option=document.createElement('option');option.value=obj._key;option.textContent=typeInfo(obj.type).name;objectSelect.append(option)});const typeSelect=$('assignType');typeSelect.innerHTML='';Object.entries(state.config.types).forEach(([value,info])=>{const option=document.createElement('option');option.value=value;option.textContent=info.name;typeSelect.append(option)});objectSelect.value='';updateAssignFields();$('assignDialog').showModal()}
    function updateAssignFields(){const existing=state.objects.find(obj=>obj._key===$('assignObject').value),type=existing?.type||$('assignType').value,info=typeInfo(type);$('typeRow').hidden=Boolean(existing);const fields=$('assignField');fields.innerHTML='';Object.entries(info.fields).forEach(([value,field])=>{const option=document.createElement('option');option.value=value;option.textContent=field.name;fields.append(option)});updateGridVisibility()}
    function updateGridVisibility(){const existing=state.objects.find(obj=>obj._key===$('assignObject').value),type=existing?.type||$('assignType').value,field=typeInfo(type).fields[$('assignField').value];$('gridSize').hidden=field?.kind!=='grid'}
    async function confirmAssign(){const existing=state.objects.find(obj=>obj._key===$('assignObject').value),type=existing?.type||$('assignType').value,field=$('assignField').value,info=typeInfo(type).fields[field];if(!info)return;const obj=existing||{type,regions:[],_key:key()};if(!existing)state.objects.push(obj);const region={_key:key(),kind:info.kind==='grid'?'table':'region',field,page:state.draft.page,rect:state.draft.rect.map(x=>Number(x.toFixed(6))),rotation:0,status:'pending',text:''};if(region.kind==='table'){const columns=Math.max(1,Math.min(20,Number($('gridColumns').value)||1)),rows=Math.max(1,Math.min(100,Number($('gridRows').value)||1));region.grid={x:equalCuts(columns),y:equalCuts(rows),statuses:statusMatrix(rows,columns)};ensureCells(region)}obj.regions.push(region);state.draft=null;state.selected=region._key;$('assignDialog').close();changed('Область добавлена');renderAll();await runOcr(obj,region)}

    function renderObjects(){const root=$('objects');root.innerHTML='';if(!state.source){root.innerHTML='<div class="empty">Сначала откройте PDF</div>';return}if(!state.objects.length){root.innerHTML='<div class="empty">Выделите прямоугольник на PDF</div>';return}state.objects.forEach((obj,objIndex)=>{const card=document.createElement('article');card.className='object-card';const head=document.createElement('div');head.className='object-head';const title=document.createElement('strong');title.textContent=`${objIndex+1}. ${typeInfo(obj.type).name}`;head.append(title,smallButton('↑',()=>moveObject(objIndex,-1),objIndex===0),smallButton('↓',()=>moveObject(objIndex,1),objIndex===state.objects.length-1),smallButton('Удалить',()=>deleteObject(objIndex),false,'danger'));card.append(head);obj.regions.forEach((region,regionIndex)=>card.append(regionCard(obj,region,regionIndex)));root.append(card)})}
    function smallButton(label,action,disabled=false,className=''){const button=document.createElement('button');button.className=`mini ${className}`;button.textContent=label;button.disabled=disabled;button.onclick=event=>{event.stopPropagation();action()};return button}
    function regionCard(obj,region,index){const card=document.createElement('section');card.className=`region-card${state.selected===region._key?' active':''}`;card.dataset.key=region._key;card.onclick=()=>{state.selected=region._key;renderPdf();document.querySelectorAll('.region-card').forEach(x=>x.classList.toggle('active',x===card))};const top=document.createElement('div');top.className='region-top';const title=document.createElement('b');title.textContent=`${fieldInfo(obj,region.field).name} · стр. ${region.page}`;const badge=document.createElement('span');badge.className=`badge ${region.status}`;badge.textContent=STATUS[region.status]||region.status;top.append(title,badge,smallButton('↻ OCR',()=>runOcr(obj,region)),smallButton('✦ ИИ',()=>correctRegion(obj,region)),smallButton('↻90°',()=>rotateRegion(region)),smallButton('×',()=>deleteRegion(obj,index),false,'danger'));card.append(top);if(region.kind==='table')card.append(tableEditor(obj,region));else{const textarea=document.createElement('textarea');textarea.className='value';textarea.value=region.text||'';textarea.placeholder='Результат OCR или ручной текст';textarea.oninput=()=>{region.text=textarea.value;region.status='modified';delete region.error;changed('Текст изменён');badge.className='badge modified';badge.textContent=STATUS.modified};card.append(textarea)}if(region.error){const error=document.createElement('div');error.className='error-text';error.textContent=region.error;card.append(error)}return card}
    function tableEditor(obj,region){ensureCells(region);const wrap=document.createElement('div'),controls=document.createElement('div');controls.className='table-controls';controls.append(smallButton('+ столбец',()=>changeGrid(region,'x',1)),smallButton('− столбец',()=>changeGrid(region,'x',-1),region.grid.x.length<=2),smallButton('+ строка',()=>changeGrid(region,'y',1)),smallButton('− строка',()=>changeGrid(region,'y',-1),region.grid.y.length<=2));wrap.append(controls);const table=document.createElement('table');table.className='table-edit';region._cells.forEach((row,r)=>{const tr=document.createElement('tr');row.forEach((value,c)=>{const td=document.createElement('td'),textarea=document.createElement('textarea');textarea.value=value;textarea.setAttribute('aria-label',`Строка ${r+1}, столбец ${c+1}`);textarea.oninput=()=>{region._cells[r][c]=textarea.value;region.text=tableText(region);region.grid.statuses[r][c]='modified';region.status='modified';changed('Ячейка изменена')};const ai=smallButton('✦',()=>correctCell(obj,region,r,c));ai.classList.add('cell-ai');ai.title='Исправить только эту ячейку через ИИ';td.append(textarea,ai);tr.append(td)});table.append(tr)});wrap.append(table);return wrap}
    function changeGrid(region,axis,delta){ensureCells(region);const cuts=region.grid[axis];if(delta>0){let widest=0;for(let i=1;i<cuts.length;i++)if(cuts[i]-cuts[i-1]>cuts[widest+1]-cuts[widest])widest=i;cuts.splice(widest+1,0,Number(((cuts[widest]+cuts[widest+1])/2).toFixed(6)));if(axis==='x'){region._cells.forEach(row=>row.splice(widest+1,0,''));region.grid.statuses.forEach(row=>row.splice(widest+1,0,'pending'))}else{const columns=region.grid.x.length-1;region._cells.splice(widest+1,0,Array(columns).fill(''));region.grid.statuses.splice(widest+1,0,Array(columns).fill('pending'))}}else{cuts.splice(-2,1);if(axis==='x'){region._cells.forEach(row=>row.pop());region.grid.statuses.forEach(row=>row.pop())}else{region._cells.pop();region.grid.statuses.pop()}}ensureCells(region);region.status='modified';changed('Сетка изменена; повторите OCR');renderAll()}
    function moveObject(index,delta){const target=index+delta;if(target<0||target>=state.objects.length)return;[state.objects[index],state.objects[target]]=[state.objects[target],state.objects[index]];changed('Порядок объектов изменён');renderObjects()}
    function deleteObject(index){if(!confirm('Удалить объект и все его области?'))return;state.objects.splice(index,1);state.selected=null;changed('Объект удалён');renderAll()}
    function deleteRegion(obj,index){if(!confirm('Удалить область и её текст?'))return;obj.regions.splice(index,1);if(!obj.regions.length)state.objects.splice(state.objects.indexOf(obj),1);state.selected=null;changed('Область удалена');renderAll()}
    function rotateRegion(region){region.rotation=(Number(region.rotation||0)+90)%360;region.status='modified';changed('Поворот изменён; повторите OCR');renderAll()}
    function scrollCard(regionKey){document.querySelector(`.region-card[data-key="${regionKey}"]`)?.scrollIntoView({block:'nearest'})}

    function cellRect(region,row,column){const [x,y,w,h]=region.rect,x0=region.grid.x[column],x1=region.grid.x[column+1],y0=region.grid.y[row],y1=region.grid.y[row+1];return[x+x0*w,y+y0*h,(x1-x0)*w,(y1-y0)*h]}
    async function recognize(page,rect,rotation){const result=await api('/api/ocr',{method:'POST',body:JSON.stringify({source:state.source,page,rect,rotation})});return result.text}
    async function runOcr(obj,region){if(state.busy)return;state.busy++;region.status='queued';delete region.error;renderAll();await save(true);try{region.status='running';renderAll();if(region.kind==='table'){ensureCells(region);let failed=0;for(let r=0;r<region._cells.length;r++)for(let c=0;c<region._cells[r].length;c++){region.grid.statuses[r][c]='running';renderObjects();try{const text=await recognize(region.page,cellRect(region,r,c),region.rotation);region._cells[r][c]=String(text).replace(/\s*\r?\n\s*/g,' ').trim();region.grid.statuses[r][c]='recognized'}catch(error){failed++;region.grid.statuses[r][c]='error';region.error=`Не распознано ячеек: ${failed}. Последняя ошибка: ${error.message}`}region.text=tableText(region)}region.status=failed?'error':'recognized';if(!failed)delete region.error}else{region.text=await recognize(region.page,region.rect,region.rotation);region.status='recognized'}changed('OCR завершён');await save(true);setStatus(region.status==='recognized'?'OCR выполнено':'OCR завершён с ошибками')}catch(error){region.status='error';region.error=error.message;changed('Ошибка OCR');await save(true);toast(error.message,true)}finally{state.busy--;renderAll()}}
    async function requestCorrection(obj,field,text){const result=await api('/api/correct',{method:'POST',body:JSON.stringify({type:obj.type,field,text})});return result.text}
    async function correctRegion(obj,region){if(region.kind==='table'){toast('Для таблицы ИИ применяется кнопкой ✦ к отдельной ячейке',true);return}if(!String(region.text||'').trim()){toast('Нечего корректировать',true);return}state.busy++;try{setStatus('ИИ исправляет блок…');region.text=await requestCorrection(obj,region.field,region.text);region.status='modified';changed('ИИ-коррекция вставлена без проверки');await save(true)}catch(error){toast(error.message,true);setStatus('Ошибка ИИ-коррекции')}finally{state.busy--;renderAll()}}
    async function correctCell(obj,region,row,column){const text=region._cells[row][column];if(!String(text||'').trim()){toast('Ячейка пуста',true);return}state.busy++;try{setStatus(`ИИ исправляет ячейку ${row+1}:${column+1}…`);region._cells[row][column]=await requestCorrection(obj,region.field,text);region.grid.statuses[row][column]='modified';region.status='modified';region.text=tableText(region);changed('ИИ-коррекция ячейки вставлена');await save(true)}catch(error){toast(error.message,true);setStatus('Ошибка ИИ-коррекции')}finally{state.busy--;renderAll()}}

    $('openFile').onclick=openDialog;$('openSource').onclick=()=>openSource($('sourceInput').value);$('sourceInput').onkeydown=event=>{if(event.key==='Enter')openSource(event.currentTarget.value)};$('save').onclick=()=>save();$('applyMarkdown').onclick=applyMarkdown;$('markdownEditor').oninput=()=>{state.rawDirty=true;state.dirty=true;$('save').disabled=false;$('rawError').textContent='';setStatus('Markdown изменён — примените или сохраните')};$('zoomIn').onclick=()=>{state.zoom=Math.min(1.8,state.zoom+.1);renderPdf()};$('zoomOut').onclick=()=>{state.zoom=Math.max(.5,state.zoom-.1);renderPdf()};$('addHint').onclick=()=>toast('Проведите мышью по нужной области PDF');$('assignObject').onchange=updateAssignFields;$('assignType').onchange=updateAssignFields;$('assignField').onchange=updateGridVisibility;$('assignCancel').onclick=()=>{$('assignDialog').close();state.draft=null;renderPdf()};$('assignOk').onclick=confirmAssign;window.onbeforeunload=event=>{if(state.dirty){event.preventDefault();event.returnValue=''}};
    (async()=>{try{await loadConfig();const query=new URLSearchParams(location.search),initial=query.get('source')||query.get('path')||query.get('blob');if(initial){$('sourceInput').value=initial;await openSource(initial)}}catch(error){toast(error.message,true);setStatus('Ошибка конфигурации')}})();
  </script>
</body>
</html>
