<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Digitizer</title>
  <style>
    :root{color-scheme:light;--bg:#eef1f5;--panel:#fff;--line:#d5dbe4;--ink:#172033;--muted:#667085;--blue:#2864dc;--green:#16845b;--yellow:#c88900;--red:#c93f4b;--violet:#7255c6}
    *{box-sizing:border-box}body{margin:0;height:100vh;overflow:hidden;background:var(--bg);color:var(--ink);font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
    button,input,select,textarea{font:inherit}button{border:1px solid var(--line);border-radius:7px;background:#fff;padding:7px 10px;color:var(--ink);cursor:pointer}button:hover{border-color:#9ba8ba}button:disabled{opacity:.5;cursor:default}.primary{background:var(--blue);border-color:var(--blue);color:#fff}.danger{color:var(--red)}
    header{height:58px;display:flex;align-items:center;gap:8px;padding:9px 14px;background:var(--panel);border-bottom:1px solid var(--line)}header strong{font-size:17px;margin-right:4px}#sourceInput{min-width:180px;flex:1;max-width:620px;padding:8px 10px;border:1px solid var(--line);border-radius:7px}#status{margin-left:auto;color:var(--muted);white-space:nowrap}.dirty{color:var(--yellow)!important}
    main{display:grid;grid-template-columns:minmax(420px,56%) minmax(380px,44%);height:calc(100vh - 58px)}.pdf-pane,.side{min-width:0;overflow:hidden}.pdf-pane{position:relative;border-right:1px solid var(--line)}
    .pdf-toolbar{height:42px;display:flex;align-items:center;gap:6px;padding:5px 10px;background:#f8fafc;border-bottom:1px solid var(--line)}.pdf-toolbar span{color:var(--muted);margin-right:auto}.pdf-scroll{height:calc(100% - 42px);overflow:auto;padding:18px;background:#cfd5dd}
    .page{position:relative;margin:0 auto 18px;max-width:980px;background:#fff;box-shadow:0 3px 18px #4b556344;user-select:none}.page img{display:block;width:100%;height:auto;pointer-events:none}.overlay{position:absolute;inset:0;cursor:crosshair}.page-number{position:absolute;right:6px;bottom:5px;background:#111a;color:#fff;padding:2px 6px;border-radius:4px;pointer-events:none}
    .region{position:absolute;border:2px solid var(--yellow);background:#c8890014;cursor:move;min-width:5px;min-height:5px}.region::before{content:"";position:absolute;inset:-10px}.region.recognized{border-color:var(--green);background:#16845b10}.region.modified{border-color:var(--red);background:#c93f4b10}.region.error{border-color:var(--red);background:#c93f4b1c}.region.queued,.region.running{border-color:var(--yellow);animation:pulse 1s infinite alternate}.region.selected{outline:3px solid #2864dc55;z-index:4}.region-tools{position:absolute;left:-2px;bottom:calc(100% + 5px);z-index:10;display:flex;flex-wrap:wrap;align-items:center;gap:3px;width:max-content;max-width:min(680px,calc(100vw - 16px));padding:3px;border-radius:6px;background:#182235;box-shadow:0 5px 15px #11182755;opacity:0;visibility:hidden;pointer-events:none;transform:translateY(3px);transition:opacity .12s,transform .12s,visibility .12s}.region:hover>.region-tools,.region:focus-within>.region-tools{opacity:1;visibility:visible;pointer-events:auto;transform:none}.region-tools.below{top:calc(100% + 5px);bottom:auto}.region-label{max-width:250px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#fff;padding:1px 5px;font-size:12px;pointer-events:none}.region-tool{flex:none;border-color:#536075;background:#fff;padding:2px 6px;border-radius:4px;font-size:12px;line-height:18px}.region-tool.danger{font-weight:700}.region.table-region .region-tools{bottom:calc(100% + 24px)}.region.table-region .region-tools.below{top:calc(100% + 5px);bottom:auto}.handle{position:absolute;width:12px;height:12px;right:-7px;bottom:-7px;border:2px solid #fff;border-radius:50%;background:var(--blue);cursor:nwse-resize}.grid-line{position:absolute;background:#7255c6;z-index:2}.grid-line.x{top:0;bottom:0;width:2px;cursor:ew-resize}.grid-line.y{left:0;right:0;height:2px;cursor:ns-resize}.grid-rail{position:absolute;background:#dcd4f5;border:1px solid #9d8bd2;z-index:5;cursor:crosshair}.grid-rail.x{left:-2px;right:-2px;top:-21px;height:18px}.grid-rail.y{top:-2px;bottom:-2px;left:-21px;width:18px}.grid-dot{position:absolute;width:10px;height:10px;border:2px solid #fff;border-radius:50%;background:var(--violet);box-shadow:0 0 0 1px #4f3b91;transform:translate(-50%,-50%);cursor:pointer}.grid-rail.x .grid-dot{top:50%}.grid-rail.y .grid-dot{left:50%}@keyframes pulse{to{opacity:.48}}
    .draft{position:absolute;border:2px dashed var(--blue);background:#2864dc18;pointer-events:none}
    .side{display:grid;grid-template-rows:minmax(250px,58%) minmax(180px,42%);background:var(--panel)}.objects-pane,.markdown-pane{min-height:0;display:flex;flex-direction:column}.objects-pane{border-bottom:1px solid var(--line)}.pane-title{height:42px;display:flex;align-items:center;gap:7px;padding:6px 10px;background:#f8fafc;border-bottom:1px solid var(--line)}.pane-title strong{margin-right:auto}.object-list{overflow:auto;padding:10px}
    .empty{padding:34px 15px;text-align:center;color:var(--muted)}.object-card{border:1px solid var(--line);border-radius:9px;margin-bottom:10px;overflow:hidden;background:#fff}.object-head{display:flex;align-items:center;gap:6px;padding:7px 9px;background:#f6f8fb;border-bottom:1px solid var(--line)}.object-head strong{margin-right:auto}.mini{padding:3px 7px;font-size:12px}.region-card{padding:9px;border-bottom:1px solid #e7ebf0}.region-card:last-child{border-bottom:0}.region-card.active{box-shadow:inset 3px 0 var(--blue)}.region-top{display:flex;align-items:center;gap:6px;margin-bottom:7px}.region-top b{margin-right:auto}.badge{font-size:11px;border-radius:999px;padding:2px 7px;background:#eef2f7;color:var(--muted)}.badge.recognized{color:var(--green);background:#e7f7f0}.badge.modified,.badge.error{color:var(--red);background:#fff0f1}.badge.running,.badge.queued{color:#9a6a00;background:#fff7da}
    textarea.value{display:block;width:100%;min-height:66px;resize:vertical;border:1px solid var(--line);border-radius:6px;padding:7px;background:#fff}.table-edit{width:100%;border-collapse:collapse}.table-edit th{border:1px solid var(--line);padding:4px;background:#f3f5f8}.table-edit th select{width:100%;min-width:115px;padding:4px;border:1px solid var(--line);border-radius:5px;background:#fff}.table-edit th select.unselected{border-color:var(--red);color:var(--red)}.table-edit td{border:1px solid var(--line);padding:0;vertical-align:top;position:relative}.table-edit td.brand-missing{background:#fff0f1;box-shadow:inset 0 0 0 2px var(--red)}.table-edit td.relation-missing,.table-edit td.applicability-missing{background:#fff7da;box-shadow:inset 0 0 0 2px var(--yellow)}.table-edit td.linked{background:#e7f7f0;box-shadow:inset 0 0 0 2px var(--green)}.table-edit textarea{border:0;resize:vertical;display:block;width:100%;min-height:48px;padding:6px;padding-right:55px;background:transparent}.applicability-value{display:block;width:100%;min-height:48px;border:0;padding:6px;background:transparent}.cell-ai{position:absolute;right:3px;top:3px;padding:2px 6px;color:var(--violet)}.cell-normalize{position:absolute;right:29px;top:3px;padding:2px 6px;color:var(--green)}.normalization-list{display:grid;gap:4px;padding:5px}.normalization-row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:3px;align-items:center}.normalization-row select{width:100%;min-width:0;padding:5px;border:1px solid var(--green);border-radius:5px;background:#f2fbf7}.normalization-row select.unresolved,.normalization-row select.catalog-missing{border-color:var(--red);background:#fff0f1;color:var(--red)}.normalization-action{padding:3px 7px;min-width:29px}.catalog-add{border-color:var(--red);color:var(--red);background:#fff0f1}.normalization-source{margin-top:2px;padding:5px 6px;border-top:1px dashed var(--line);color:var(--muted);font-size:10px;white-space:pre-wrap;overflow-wrap:anywhere}.cell-photo{display:block;width:100%;max-height:150px;object-fit:contain;margin-top:2px;border-top:1px dashed var(--line);background:#fff}.error-text{color:var(--red);font-size:12px;margin-top:5px;white-space:pre-wrap}
    .table-edit td.applicability-invalid{background:#fff0f1;box-shadow:inset 0 0 0 2px var(--red)}.applicability-editor{display:flex;flex-direction:column;min-width:72px}.applicability-editor .cell-photo{margin-top:0}.applicability-value{font-size:18px;font-weight:700;text-align:center;cursor:pointer}
    .normalization-list{display:grid;gap:6px;padding:6px}.normalization-card{display:grid;grid-template-columns:16px minmax(0,1fr) auto auto;gap:5px;align-items:center;min-height:36px;padding:4px 5px;border:1px solid transparent;border-radius:8px;box-shadow:0 1px 2px #10182814;transition:border-color .12s,box-shadow .12s,transform .12s}.normalization-card.is-green{border-color:#8fd2b7;background:#e7f7f0}.normalization-card.is-yellow{border-color:#e2c05b;background:#fff7da}.normalization-card.is-red{border-color:#ee9aa2;background:#fff0f1}.normalization-card.drag-over{box-shadow:0 0 0 2px var(--blue);transform:translateY(1px)}.normalization-handle{width:13px;height:19px;border:0;padding:0;border-radius:3px;background:radial-gradient(circle at 2px 2px,#7a8698 1.5px,transparent 1.8px) 0 0/7px 7px;cursor:grab}.normalization-handle:active{cursor:grabbing}.normalization-choice{width:100%;min-width:0;border:0;outline:0;background:transparent;color:var(--ink);font-weight:600;cursor:pointer}.normalization-card.is-red .normalization-choice{color:#9f2732}.normalization-card.is-yellow .normalization-choice{color:#805900}.normalization-action{padding:3px 7px;min-width:29px;align-self:stretch}.catalog-add{border-color:var(--red);color:var(--red);background:#fff8f8;white-space:nowrap}.normalization-add{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:5px;margin-top:1px}.normalization-add button{padding:5px 9px;color:var(--green)}.validated-control{position:relative;min-width:0}.validated-control input{position:relative;z-index:1;width:100%;min-width:0;padding:6px 8px;border:1px solid #98a2b3;border-radius:6px;outline:0;background:transparent;color:var(--ink)}.validated-control input:focus{border-color:var(--blue);box-shadow:0 0 0 2px #2864dc22}.validation-overlay{position:absolute;z-index:0;inset:0;overflow:hidden;padding:7px 9px;border:1px solid transparent;border-radius:6px;color:transparent;white-space:pre;pointer-events:none}.validation-overlay .invalid-char{border-radius:2px;background:#f0443847;box-shadow:inset 0 -2px #d92d20}.normalization-help{color:var(--muted);font-size:10px;line-height:1.25}.normalization-source{margin-top:0}.normalization-card .validated-control{grid-column:2}.normalization-card .validated-control input{font-weight:600}
    #markdownEditor{flex:1;min-height:0;width:100%;resize:none;border:0;padding:12px;font:12px/1.45 ui-monospace,SFMono-Regular,Consolas,monospace;tab-size:2;outline:none}.raw-error{color:var(--red);font-size:12px;max-width:52%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .context-menu,.context-menu ul{position:fixed;z-index:50;min-width:205px;max-width:calc(100vw - 8px);max-height:calc(100vh - 8px);overflow:auto;margin:0;padding:4px;list-style:none;border:1px solid #aeb7c4;border-radius:6px;background:#fff;box-shadow:0 8px 25px #11182744}.context-menu ul{display:none;left:0;top:0;z-index:51}.context-menu li{position:relative}.context-menu li:hover>ul,.context-menu li:focus-within>ul{display:block}.context-menu button{display:flex;width:100%;align-items:center;gap:12px;border:0;border-radius:3px;padding:7px 9px;text-align:left;white-space:nowrap}.context-menu button:hover,.context-menu button:focus{outline:0;background:#e7efff}.context-menu .arrow{margin-left:auto;color:#667085}.context-menu .separator{height:1px;margin:4px;background:#d9dee7}.context-menu .object-kind{color:var(--muted);font-size:12px}
    .toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);padding:9px 14px;border-radius:8px;background:#182235;color:#fff;z-index:20;box-shadow:0 4px 20px #1115}.toast.error{background:var(--red)}
    @media(max-width:900px){main{grid-template-columns:1fr}.pdf-pane{display:none}.side{grid-template-rows:58% 42%}}
  </style>
</head>
<body>
  <header>
    <strong>Digitizer</strong>
    <button id="openFile" title="Диалог откроется на компьютере, где запущен Digitizer">Выбрать на сервере</button>
    <button id="uploadFile" title="Передать PDF с компьютера, на котором открыт браузер">Загрузить PDF</button>
    <input id="pdfUpload" type="file" accept="application/pdf,.pdf" hidden>
    <input id="sourceInput" placeholder="Путь к PDF на сервере или URL">
    <button id="openSource">Открыть</button>
    <span id="status">Откройте PDF</span>
  </header>
  <main>
    <section class="pdf-pane">
      <div class="pdf-toolbar"><span>Выделите прямоугольник мышью</span><button id="zoomOut">−</button><button id="zoomIn">＋</button></div>
      <div id="pdf" class="pdf-scroll"></div>
    </section>
    <section class="side">
      <div class="objects-pane">
        <div class="pane-title"><strong>Объекты</strong><button id="addHint" disabled>Как добавить</button></div>
        <div id="objects" class="object-list"><div class="empty">Сначала откройте PDF</div></div>
      </div>
      <div class="markdown-pane">
        <div class="pane-title"><strong>Markdown — автосохранение</strong><span id="rawError" class="raw-error"></span><button id="applyMarkdown">Применить</button></div>
        <textarea id="markdownEditor" spellcheck="false" placeholder="Разметка появится здесь"></textarea>
      </div>
    </section>
  </main>

  <div id="assignMenu" class="context-menu" hidden></div>

  <script>
    const $=id=>document.getElementById(id);
    const STATUS={pending:'Ожидает OCR',queued:'В очереди',running:'Распознаётся',recognized:'Распознано',modified:'Изменено',error:'Ошибка'};
    const CELL_STATUS={'brand-missing':'Значение некорректно или марки нет в BrandsCsv','relation-missing':'Связи нет в RelationsCsv','applicability-missing':'Признак ещё не сохранён в BrandsCsv','applicability-invalid':'Допустим только один знак + или -',linked:'Значение найдено в CSV'};
    const state={config:null,source:'',name:'',pageCount:0,objects:[],selected:null,draft:null,drag:null,zoom:1,dirty:false,rawDirty:false,busy:0,ocrQueue:Promise.resolve(),revision:0,saveTimer:null,saving:null,saveAgain:false};
    let keyCounter=0,normalizationDrag=null;
    const key=()=>`r${++keyCounter}`;

    async function api(url,options={}){const response=await fetch(url,{headers:{'Content-Type':'application/json'},...options});if(!response.ok){let message=response.statusText;try{message=(await response.json()).detail||message}catch{}throw new Error(message)}return response.json()}
    function toast(message,error=false){const node=document.createElement('div');node.className=`toast${error?' error':''}`;node.textContent=message;document.body.append(node);setTimeout(()=>node.remove(),3500)}
    function setStatus(message){$('status').textContent=message;$('status').classList.toggle('dirty',state.dirty)}
    function typeInfo(type){return state.config?.types?.[type]||{name:type,fields:{}}}
    function fieldInfo(obj,field){return typeInfo(obj.type).fields[field]||{name:field,kind:'text'} }
    function isApplicabilityType(type){return Boolean(state.config?.normalization?.applicabilityTypes?.[type])}
    function decorate(objects){for(const obj of objects){obj._key=obj._key||key();for(const region of obj.regions||[]){region._key=region._key||key();if(region.kind==='table')ensureCells(region)}}return objects}
    function equalCuts(count){return Array.from({length:count+1},(_,i)=>Number((i/count).toFixed(6)))}
    function statusMatrix(rows,columns,current=[]){return Array.from({length:rows},(_,r)=>Array.from({length:columns},(_,c)=>current?.[r]?.[c]||'pending'))}
    function splitTableRow(line){let value=line.trim();if(value.startsWith('|'))value=value.slice(1);if(value.endsWith('|')&&!value.endsWith('\\|'))value=value.slice(0,-1);const cells=[],part=[];let escaped=false;for(const char of value){if(escaped){part.push(char);escaped=false}else if(char==='\\'){escaped=true}else if(char==='|'){cells.push(part.join('').trim());part.length=0}else part.push(char)}if(escaped)part.push('\\');cells.push(part.join('').trim());return cells}
    function parseTable(text,rows,columns){const lines=String(text||'').split(/\r?\n/),values=[];let start=-1;for(let i=0;i<lines.length-1;i++){const separator=splitTableRow(lines[i+1]);if(separator.length===columns&&separator.every(x=>/^:?-{3,}:?$/.test(x))){start=i+2;break}}if(start>=0)for(const line of lines.slice(start)){if(!line.trim())break;const cells=splitTableRow(line);values.push(Array.from({length:columns},(_,c)=>cells[c]||''));if(values.length===rows)break}return Array.from({length:rows},(_,r)=>Array.from({length:columns},(_,c)=>values[r]?.[c]||''))}
    function normalizeCellText(value){return String(value??'').replace(/\s*\r?\n\s*/g,' ').trim()}
    function cellParts(value){const source=String(value??'');return{text:source.replace(/<!--\s*digitizer:ocr\s+("(?:\\.|[^"\\])*")\s*-->/gi,'').trim()}}
    function cellValue(value){return cellParts(value).text}
    function sourceBlock(value,className=''){const source=document.createElement('div');source.className=`normalization-source ${className}`.trim();source.textContent=`OCR: ${value}`;source.title=value;return source}
    function escapeCell(value){return String(value??'').replace(/\r?\n/g,' ').replace(/\\/g,'\\\\').replace(/\|/g,'\\|').trim()}
    function tableText(region){const cells=region._cells||[],columns=region.grid.x.length-1;const headers=Array.from({length:columns},(_,i)=>String(i+1));return [`| ${headers.join(' | ')} |`,`| ${headers.map(()=> '---').join(' | ')} |`,...cells.map(row=>`| ${row.map(escapeCell).join(' | ')} |`)].join('\n')}
    function ensureCells(region){const rows=region.grid.y.length-1,columns=region.grid.x.length-1;const current=region._cells||parseTable(region.text,rows,columns);region._cells=Array.from({length:rows},(_,r)=>Array.from({length:columns},(_,c)=>cellValue(current?.[r]?.[c]||'')));region.grid.statuses=statusMatrix(rows,columns,region.grid.statuses);region.grid.columnTypes=Array.from({length:columns},(_,c)=>region.grid.columnTypes?.[c]||'');region.text=tableText(region)}
    function cleanRegion(region){const value={field:region.field,page:Number(region.page),rect:region.rect.map(x=>Number(Number(x).toFixed(6))),rotation:Number(region.rotation||0),status:region.status||'pending'};if(value.status==='error'&&region.error)value.error=String(region.error);if(region.kind==='table'){ensureCells(region);value.grid={x:region.grid.x.map(Number),y:region.grid.y.map(Number),statuses:region.grid.statuses,columnTypes:region.grid.columnTypes}}return value}
    function serialize(){const chunks=state.objects.map(obj=>{const lines=[`<!-- digitizer:object ${JSON.stringify({type:obj.type})} -->`];for(const region of obj.regions){if(region.kind==='table')region.text=tableText(region);lines.push(`<!-- digitizer:${region.kind} ${JSON.stringify(cleanRegion(region))} -->`);if(region.text)lines.push(String(region.text).replace(/^\n+|\n+$/g,''))}return lines.join('\n')});return chunks.length?chunks.join('\n\n').replace(/\s+$/,'')+'\n':''}
    function parseMarkdown(markdown){const regex=/<!--[ \t]*digitizer:(object|region|table)[ \t]+(\{[^\r\n]*\})[ \t]*-->/gi,matches=[...markdown.matchAll(regex)];if(!matches.length){if(markdown.trim())throw new Error('Нет маркеров digitizer');return []}if(markdown.slice(0,matches[0].index).trim())throw new Error('Текст до первого маркера не поддерживается');const objects=[];let current=null;matches.forEach((match,index)=>{const kind=match[1].toLowerCase(),meta=JSON.parse(match[2]),end=index+1<matches.length?matches[index+1].index:markdown.length,content=markdown.slice(match.index+match[0].length,end).replace(/^[\r\n]+|[\r\n]+$/g,'');if(kind==='object'){if(content.trim())throw new Error('После object ожидается область');if(!state.config.types[meta.type])throw new Error(`Неизвестный тип ${meta.type}`);current={type:meta.type,regions:[],_key:key()};objects.push(current);return}if(!current)throw new Error('Область до объекта');const info=fieldInfo(current,meta.field),expected=info.kind==='grid'?'table':'region';if(kind!==expected)throw new Error(`Полю ${meta.field} нужен маркер ${expected}`);const region={...meta,kind,text:content,_key:key()};if(['queued','running'].includes(region.status))region.status='pending';if(kind==='table')ensureCells(region);current.regions.push(region)});return objects}
    function syncRaw(){if(state.rawDirty)return;$('markdownEditor').value=serialize();$('rawError').textContent=''}
    function scheduleAutoSave(delay=700){clearTimeout(state.saveTimer);state.saveTimer=setTimeout(()=>saveNow(),delay)}
    function changed(message='Изменения ожидают автосохранения'){state.dirty=true;state.revision++;setStatus(message);syncRaw();scheduleAutoSave()}

    async function loadConfig(){state.config=await api('/api/config')}
    async function autoNormalizeLoadedTables(){for(const obj of state.objects)for(const region of obj.regions)if(region.kind==='table'&&region.grid.columnTypes.some(Boolean))await normalizeTypedTable(region,null,false);if(state.dirty)await saveNow()}
    async function openSource(value){value=String(value||'').trim();if(!value)return;try{if(state.dirty&&!(await saveNow()))return;clearTimeout(state.saveTimer);setStatus('Открываю PDF…');const result=await api(`/api/document?source=${encodeURIComponent(value)}`);state.source=result.source;state.name=result.name;state.pageCount=result.pageCount;state.objects=decorate(result.objects||[]);state.selected=null;state.dirty=false;state.rawDirty=false;state.revision=0;$('sourceInput').value=result.source;$('addHint').disabled=false;syncRaw();renderAll();await autoNormalizeLoadedTables();setStatus(`${result.name} · ${result.pageCount} стр. · автосохранение`)}catch(error){setStatus('Ошибка открытия');toast(error.message,true)}}
    async function openDialog(){try{const result=await api('/api/open/dialog',{method:'POST',body:'{}'});if(!result.cancelled)openSource(result.source)}catch(error){toast(error.message,true)}}

    function normalizationSource(items){return items.map(item=>item.source).filter(Boolean).join('; ')}
    function invalidNormalizationCharacters(value){const chars=[...String(value??'')],invalid=new Set(),open=[];chars.forEach((char,index)=>{if(char==='(')open.push(index);else if(char===')'){if(open.length)open.pop();else invalid.add(index)}});open.forEach(index=>invalid.add(index));chars.forEach((char,index)=>{if(/[А-Яа-яЁё0-9]/.test(char))return;if(char==='('||char===')')return;if(char===' '&&chars[index-1]!==' '&&chars[index+1]!==' ')return;invalid.add(index)});return invalid}
    function renderValidationOverlay(overlay,value){overlay.innerHTML='';const invalid=invalidNormalizationCharacters(value);[...String(value??'')].forEach((char,index)=>{if(!invalid.has(index)){overlay.append(document.createTextNode(char));return}const mark=document.createElement('span');mark.className='invalid-char';mark.textContent=char;overlay.append(mark)});overlay.title=invalid.size?'Подсвечены нерусские символы, знаки и повторные пробелы':''}
    function validatedInput(value,placeholder,commit,candidates=[]){const wrapper=document.createElement('div'),overlay=document.createElement('div'),input=document.createElement('input'),list=document.createElement('datalist'),listId=`normalization-${key()}`;wrapper.className='validated-control';overlay.className='validation-overlay';input.value=value;input.placeholder=placeholder;input.autocomplete='off';input.setAttribute('aria-label',placeholder);if(candidates.length){list.id=listId;input.setAttribute('list',listId);for(const candidate of candidates){const option=document.createElement('option');option.value=candidate.value;list.append(option)}}const update=()=>renderValidationOverlay(overlay,input.value);let submitted=false;const submit=()=>{if(submitted||!input.value.trim())return;submitted=true;input.disabled=true;void commit(input.value.trim()).catch(error=>{submitted=false;input.disabled=false;toast(error.message,true);input.focus()})};input.oninput=update;input.onkeydown=event=>{if(event.key==='Enter'){event.preventDefault();submit()}};input.onblur=submit;update();wrapper.append(overlay,input,list);return{wrapper,input,submit}}
    function normalizationCardStatus(item,cellStatus=''){if(item.catalogMissing)return'red';if(!item.resolved)return'yellow';if(['relation-missing','applicability-missing'].includes(cellStatus))return'yellow';return'green'}
    async function replaceNormalizationItem(items,index,value,onchange,append=false){state.busy++;try{setStatus(append?'Добавляю значение…':'Проверяю изменённое значение…');const result=await requestNormalization(value);if(append)items.push(...result.items);else items.splice(index,1,...result.items);onchange(items);setStatus(result.resolved?'Значение распознано':'Проверьте выделенные карточки')}finally{state.busy--;renderAll()}}
    async function addCatalogItem(item,index,items,onchange){if(!item.proposal)return;state.busy++;try{setStatus('Добавляю марку и НД в BrandsCsv…');const saved=await api('/api/catalog',{method:'POST',body:JSON.stringify({brand:item.proposal.brand,document:item.proposal.document})}),result=await requestNormalization(item.proposal.value);items.splice(index,1,...result.items);onchange(items);toast(saved.added?'Добавлено в BrandsCsv':'Запись уже есть в BrandsCsv');setStatus(`Справочник обновлён: ${saved.path}`)}catch(error){toast(error.message,true);setStatus('Не удалось дополнить справочник')}finally{state.busy--;renderAll()}}
    function normalizationEditor(items,onchange,rawSource='',preview=null,showSource=true,cellStatus=''){const root=document.createElement('div'),original=rawSource||normalizationSource(items);root.className='normalization-list';items.forEach((current,index)=>{let item=current;const card=document.createElement('div'),handle=document.createElement('button'),select=document.createElement('select'),remove=smallButton('×',()=>{items.splice(index,1);onchange(items)});card.className=`normalization-card is-${normalizationCardStatus(item,cellStatus)}`;handle.className='normalization-handle';handle.type='button';handle.draggable=true;handle.title='Перетащите, чтобы изменить порядок';handle.setAttribute('aria-label',`Перетащить карточку ${index+1}`);handle.ondragstart=event=>{normalizationDrag={items,index};event.dataTransfer.effectAllowed='move';event.dataTransfer.setData('text/plain',String(index));event.dataTransfer.setDragImage(card,10,10)};handle.ondragend=()=>{normalizationDrag=null;document.querySelectorAll('.normalization-card.drag-over').forEach(node=>node.classList.remove('drag-over'))};card.ondragover=event=>{if(normalizationDrag?.items!==items)return;event.preventDefault();card.classList.add('drag-over')};card.ondragleave=()=>card.classList.remove('drag-over');card.ondrop=event=>{event.preventDefault();card.classList.remove('drag-over');if(normalizationDrag?.items!==items||normalizationDrag.index===index)return;const [moved]=items.splice(normalizationDrag.index,1);items.splice(index,0,moved);normalizationDrag=null;onchange(items)};select.className='normalization-choice';if(!item.resolved){const unresolved=document.createElement('option');unresolved.value='';unresolved.textContent=item.value;select.append(unresolved)}for(const candidate of item.candidates||[]){const option=document.createElement('option');option.value=candidate.value;option.textContent=candidate.value;select.append(option)}select.value=item.resolved?item.value:'';select.setAttribute('aria-label',`Марка и нормативный документ ${index+1}`);select.title='Выберите вариант или дважды нажмите для ручного редактирования';select.onclick=event=>event.stopPropagation();select.onchange=()=>{const candidate=(item.candidates||[]).find(value=>value.value===select.value);if(!candidate)return;item={...item,...candidate,source:item.source||candidate.value,resolved:true,catalogMissing:false};delete item.proposal;items[index]=item;onchange(items)};select.ondblclick=event=>{event.preventDefault();event.stopPropagation();const editor=validatedInput(item.proposal?.value||item.value,'Марка по нормативному документу',value=>replaceNormalizationItem(items,index,value,onchange),item.candidates||[]);select.replaceWith(editor.wrapper);requestAnimationFrame(()=>{editor.input.focus();editor.input.select()})};remove.classList.add('normalization-action','danger');remove.title='Удалить карточку из ячейки';card.append(handle,select);if(item.catalogMissing&&item.proposal){const add=smallButton('＋ CSV',()=>addCatalogItem(item,index,items,onchange));add.classList.add('normalization-action','catalog-add');add.title=`Добавить в BrandsCsv: ${item.proposal.value}`;card.append(add)}card.append(remove);root.append(card)});const addRow=document.createElement('div'),addEditor=validatedInput('','Введите, чтобы добавить',value=>replaceNormalizationItem(items,items.length,value,onchange,true)),addButton=smallButton('＋',()=>{if(addEditor.input.value.trim())addEditor.submit();else addEditor.input.focus()});addRow.className='normalization-add';addButton.title='Добавить ещё марку по нормативному документу';addRow.append(addEditor.wrapper,addButton);root.append(addRow);const help=document.createElement('div');help.className='normalization-help';help.textContent='Двойной щелчок — редактировать. Красным подсвечены нерусские символы, знаки, непарные скобки и повторные пробелы.';root.append(help);if(showSource&&original)root.append(sourceBlock(original));if(preview)root.append(preview);return root}
    function markNormalized(region){region.status='modified';delete region.error;changed('Нормализация изменена — автосохранение');renderObjects()}
    async function requestNormalization(text){return api('/api/normalize',{method:'POST',body:JSON.stringify({text})})}
    async function refreshCellStatuses(region){ensureCells(region);if(!region.grid.columnTypes.some(Boolean)){delete region._cellStatuses;return}const result=await api('/api/relationship-statuses',{method:'POST',body:JSON.stringify({rows:region._cells.map(row=>row.map(cellValue)),columnTypes:region.grid.columnTypes})});region._cellStatuses=result.statuses}
    async function applyCellNormalization(region,row,column){const text=cellValue(region._cells[row][column]);if(!text)return null;const result=await requestNormalization(text);region._normalizations=region._normalizations||{};region._normalizations[`${row}:${column}`]=result.items;region._cells[row][column]=result.text;region.grid.statuses[row][column]='modified';region.text=tableText(region);return result}
    async function normalizedCellChanged(region,row,column,items){region._normalizations[`${row}:${column}`]=items;region._cells[row][column]=normalizationText(items);region.text=tableText(region);region.grid.statuses[row][column]='modified';markNormalized(region);try{await refreshCellStatuses(region)}catch(error){toast(error.message,true)}renderObjects()}
    async function normalizeCell(region,row,column){if(!cellValue(region._cells[row][column])){toast('Ячейка пуста',true);return}state.busy++;try{setStatus(`Нормализация ячейки ${row+1}:${column+1}…`);const result=await applyCellNormalization(region,row,column);await refreshCellStatuses(region);region.status='modified';changed(result.resolved?'Ячейка нормализована':'Нужно выбрать неоднозначную марку');await saveNow()}catch(error){toast(error.message,true);setStatus('Ошибка нормализации')}finally{state.busy--;renderAll()}}
    async function normalizeTypedTable(region,columns=null,persist=true){ensureCells(region);const selected=columns||region.grid.columnTypes.map((type,index)=>type?index:-1).filter(index=>index>=0);if(!selected.length){await refreshCellStatuses(region);return false}state.busy++;const before=region.text;let count=0,unresolved=0;try{setStatus('Автоматическая нормализация…');for(let r=0;r<region._cells.length;r++)for(const c of selected){if(!cellValue(region._cells[r][c]))continue;if(isApplicabilityType(region.grid.columnTypes[c])){normalizeApplicabilityCell(region,r,c);count++;continue}const result=await applyCellNormalization(region,r,c);count++;if(!result.resolved)unresolved++}await refreshCellStatuses(region);const textChanged=before!==region.text;if(textChanged){region.status='modified';changed(unresolved?`Нормализация: неоднозначных ячеек ${unresolved}`:'Типизированные столбцы нормализованы')}if(persist&&state.dirty)await saveNow();return count>0}catch(error){toast(error.message,true);setStatus('Ошибка автонормализации');return false}finally{state.busy--;renderAll()}}
    async function normalizeRegion(region){state.busy++;try{setStatus('Нормализация марок ГСМ…');if(region.kind==='table'){ensureCells(region);let count=0,unresolved=0;for(let r=0;r<region._cells.length;r++)for(let c=0;c<region._cells[r].length;c++){if(!cellValue(region._cells[r][c]))continue;if(isApplicabilityType(region.grid.columnTypes[c])){normalizeApplicabilityCell(region,r,c);count++;continue}const result=await applyCellNormalization(region,r,c);count++;if(!result.resolved)unresolved++}if(!count)throw new Error('В таблице нет заполненных значений');await refreshCellStatuses(region);region.status='modified';changed(unresolved?`Нормализация: неоднозначных ячеек ${unresolved}`:'Таблица нормализована')}else{const source=region.text,result=await requestNormalization(source);region._normalization=result.items;region._normalizationSource=source;region.text=result.text;region.status='modified';changed(result.resolved?'Область нормализована':'Нужно выбрать неоднозначную марку')}await saveNow()}catch(error){toast(error.message,true);setStatus('Ошибка нормализации')}finally{state.busy--;renderAll()}}
    async function saveRelationships(region){ensureCells(region);state.busy++;try{await saveNow();setStatus('Дополняю CSV связей и справочник…');const result=await api('/api/relationships',{method:'POST',body:JSON.stringify({rows:region._cells.map(row=>row.map(cellValue)),columnTypes:region.grid.columnTypes})});await refreshCellStatuses(region);toast(`Добавлено связей: ${result.added}. Обновлено признаков: ${result.applicabilityUpdated}`);setStatus(`CSV сохранены: ${result.path}; ${result.catalogPath}`)}catch(error){toast(error.message,true);setStatus('CSV не сохранены')}finally{state.busy--;renderAll()}}

    function cellRect(region,row,column){const [x,y,w,h]=region.rect,x0=region.grid.x[column],x1=region.grid.x[column+1],y0=region.grid.y[row],y1=region.grid.y[row+1];return[x+x0*w,y+y0*h,(x1-x0)*w,(y1-y0)*h]}
    async function recognize(page,rect,rotation){const result=await api('/api/ocr',{method:'POST',body:JSON.stringify({source:state.source,page,rect,rotation})});return result.text}
    function runOcr(obj,region){if(region._ocrPending)return region._ocrPending;region.status='queued';delete region.error;changed('Область поставлена в очередь OCR');renderAll();const task=state.ocrQueue.then(()=>performOcr(obj,region));state.ocrQueue=task.catch(()=>{});region._ocrPending=task.finally(()=>{delete region._ocrPending});return region._ocrPending}
    async function performOcr(obj,region){if(!state.objects.includes(obj)||!obj.regions.includes(region))return;state.busy++;try{await saveNow();region.status='running';renderAll();if(region.kind==='table'){ensureCells(region);delete region._normalizations;let failed=0;for(let r=0;r<region._cells.length;r++)for(let c=0;c<region._cells[r].length;c++){region.grid.statuses[r][c]='running';renderObjects();try{const text=normalizeCellText(await recognize(region.page,cellRect(region,r,c),region.rotation));region._cells[r][c]=text;region.grid.statuses[r][c]='recognized'}catch(error){failed++;region.grid.statuses[r][c]='error';region.error=`Не распознано ячеек: ${failed}. Последняя ошибка: ${error.message}`}region.text=tableText(region)}if(region.grid.columnTypes.some(Boolean))await normalizeTypedTable(region,null,false);region.status=failed?'error':'recognized';if(!failed)delete region.error}else{delete region._normalization;delete region._normalizationSource;region.text=await recognize(region.page,region.rect,region.rotation);region.status='recognized'}changed('OCR завершён — автосохранение');await saveNow();setStatus(region.status==='recognized'?'OCR выполнено и сохранено':'OCR завершён с ошибками')}catch(error){region.status='error';region.error=error.message;changed('Ошибка OCR — автосохранение');await saveNow();toast(error.message,true)}finally{state.busy--;renderAll()}}
    async function requestCorrection(obj,field,text){const markdown=state.rawDirty?$('markdownEditor').value:serialize(),result=await api('/api/correct',{method:'POST',body:JSON.stringify({type:obj.type,field,text,objectIndex:state.objects.indexOf(obj),markdown})});return result.text}
    async function correctRegion(obj,region){if(region.kind==='table'){toast('Для таблицы ИИ применяется кнопкой ✦ к отдельной ячейке',true);return}if(!String(region.text||'').trim()){toast('Нечего корректировать',true);return}state.busy++;try{setStatus('ИИ исправляет блок…');delete region._normalization;delete region._normalizationSource;region.text=await requestCorrection(obj,region.field,region.text);region.status='modified';changed('ИИ-коррекция вставлена — автосохранение');await saveNow()}catch(error){toast(error.message,true);setStatus('Ошибка ИИ-коррекции')}finally{state.busy--;renderAll()}}
    async function correctCell(obj,region,row,column){const text=cellValue(region._cells[row][column]);if(!text){toast('Ячейка пуста',true);return}state.busy++;try{setStatus(`ИИ исправляет ячейку ${row+1}:${column+1}…`);const corrected=normalizeCellText(await requestCorrection(obj,region.field,text));if(region._normalizations)delete region._normalizations[`${row}:${column}`];region._cells[row][column]=corrected;if(isApplicabilityType(region.grid.columnTypes[column]))normalizeApplicabilityCell(region,row,column);else if(region.grid.columnTypes[column])await applyCellNormalization(region,row,column);await refreshCellStatuses(region);region.grid.statuses[row][column]='modified';region.status='modified';region.text=tableText(region);changed('ИИ-коррекция ячейки вставлена — автосохранение');await saveNow()}catch(error){toast(error.message,true);setStatus('Ошибка ИИ-коррекции')}finally{state.busy--;renderAll()}}

    $('openFile').onclick=openDialog;$('uploadFile').onclick=()=>$('pdfUpload').click();$('pdfUpload').onchange=event=>uploadPdf(event.currentTarget.files?.[0]);$('openSource').onclick=()=>openSource($('sourceInput').value);$('sourceInput').onkeydown=event=>{if(event.key==='Enter')openSource(event.currentTarget.value)};$('applyMarkdown').onclick=applyMarkdown;$('markdownEditor').oninput=()=>{state.rawDirty=true;state.dirty=true;state.revision++;$('rawError').textContent='';setStatus('Markdown изменён — автосохранение после проверки');scheduleAutoSave()};$('zoomIn').onclick=()=>{state.zoom=Math.min(1.8,state.zoom+.1);renderPdf()};$('zoomOut').onclick=()=>{state.zoom=Math.max(.5,state.zoom-.1);renderPdf()};$('addHint').onclick=()=>toast('Проведите мышью по нужной области PDF, затем выберите пункт каскадного меню');document.addEventListener('pointerdown',event=>{if(!$('assignMenu').hidden&&!$('assignMenu').contains(event.target))hideAssign()});document.addEventListener('keydown',event=>{if(event.key==='Escape'&&!$('assignMenu').hidden)hideAssign()});window.onbeforeunload=event=>{if(state.dirty){event.preventDefault();event.returnValue=''}};
    (async()=>{try{await loadConfig();const query=new URLSearchParams(location.search),initial=query.get('source')||query.get('path')||query.get('blob');if(initial){$('sourceInput').value=initial;await openSource(initial)}}catch(error){toast(error.message,true);setStatus('Ошибка конфигурации')}})();
  </script>
