<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Оцифровка PDF</title>
  <style>
    :root{--bg:#eef1f5;--panel:#fff;--line:#d7dce4;--ink:#172033;--muted:#667085;--blue:#2563eb;--blue-soft:#eff6ff;--green:#16855b;--amber:#d97706;--red:#dc2626;--violet:#7c3aed}
    *{box-sizing:border-box}html,body{height:100%;margin:0;font:13px/1.42 Inter,Segoe UI,Arial,sans-serif;color:var(--ink);background:var(--bg)}
    button,input,select,textarea{font:inherit}button{border:0;border-radius:7px;padding:7px 10px;background:var(--blue);color:#fff;cursor:pointer}button:hover{filter:brightness(.97)}button:disabled{opacity:.42;cursor:default}.secondary{background:#f7f8fa;color:#253044;border:1px solid var(--line)}.danger{background:var(--red)}.ghost{background:transparent;color:var(--ink)}.icon{padding:3px 7px;min-width:28px}.full{width:100%}.muted{color:var(--muted)}
    header{height:56px;display:flex;align-items:center;gap:8px;padding:8px 12px;background:#111827;color:#fff}header h1{font-size:15px;margin:0 8px 0 0;white-space:nowrap}header input{min-width:220px;flex:1;padding:8px;border:1px solid #4b5563;border-radius:7px;background:#1f2937;color:#fff}.header-status{max-width:330px;color:#cbd5e1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ocr-state{padding:3px 8px;border:1px solid #475569;border-radius:12px;color:#cbd5e1;font-size:11px;white-space:nowrap}.ocr-state.ready{border-color:#059669;color:#a7f3d0}
    .layout{height:calc(100% - 56px);display:grid;grid-template-columns:minmax(520px,1.08fr) minmax(620px,.92fr);gap:1px;background:var(--line)}.column{min-width:0;display:flex;flex-direction:column;background:var(--panel)}
    .toolbar{min-height:48px;display:flex;align-items:center;gap:7px;padding:7px 9px;border-bottom:1px solid var(--line)}.toolbar strong{white-space:nowrap}.toolbar select,.toolbar input{min-width:0;padding:6px;border:1px solid var(--line);border-radius:6px;background:#fff}.grow{flex:1}.scroll{overflow:auto;min-height:0;flex:1}
    .pdf-view{padding:18px;background:#cbd2dc;user-select:none}.pdf-page{position:relative;max-width:950px;margin:0 auto 18px;background:#fff;box-shadow:0 3px 14px #33415545}.pdf-page>img{display:block;width:100%;pointer-events:none}.overlay{position:absolute;inset:0;cursor:crosshair}.page-no{position:absolute;right:7px;bottom:6px;padding:2px 7px;border-radius:10px;background:#111827cc;color:#fff;font-size:11px;pointer-events:none}
    .region{position:absolute;border:2px solid var(--blue);background:#2563eb14;cursor:pointer}.region.pending{border-color:#64748b}.region.queued,.region.running{border-color:var(--amber);background:#f59e0b17}.region.recognized{border-color:var(--green);background:#10b98114}.region.modified{border-color:var(--violet);background:#8b5cf61a}.region.error{border-color:var(--red);background:#ef44441a}.region.selected{outline:3px solid #fff;box-shadow:0 0 0 5px #0f172a99}.region-label{position:absolute;left:-2px;top:-23px;max-width:240px;padding:2px 6px;border-radius:5px 5px 0 0;color:#fff;background:#2563eb;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.region-actions{display:none;position:absolute;right:2px;top:2px;gap:3px}.region:hover .region-actions,.region.selected .region-actions{display:flex}.region-actions button{padding:2px 5px;background:#111827e8}.grid-line{position:absolute;background:#f43f5e;z-index:2}.grid-line.v{top:0;bottom:0;width:2px;cursor:col-resize}.grid-line.h{left:0;right:0;height:2px;cursor:row-resize}
    .pending-banner{display:none;padding:10px 12px;background:#fff7ed;border-bottom:1px solid #fed7aa}.pending-banner.active{display:flex;align-items:center;gap:9px}.pending-dot{width:10px;height:10px;border-radius:50%;background:var(--amber)}
    .browser{display:grid;grid-template-columns:minmax(185px,.86fr) minmax(230px,1.08fr) minmax(260px,1.2fr);min-height:0;flex:1}.browser-col{min-width:0;overflow:auto;border-right:1px solid var(--line);background:#fff}.browser-col:last-child{border-right:0}.col-head{position:sticky;top:0;z-index:3;display:flex;align-items:center;gap:5px;min-height:39px;padding:7px 9px;border-bottom:1px solid var(--line);background:#f8fafc;font-weight:650}.col-body{padding:7px}.nav-list{display:grid;gap:5px}.nav-item{display:flex;align-items:center;gap:7px;width:100%;min-height:37px;padding:7px 8px;text-align:left;background:#fff;color:var(--ink);border:1px solid var(--line)}.nav-item:hover{border-color:#93b4f8}.nav-item.active{border-color:var(--blue);background:var(--blue-soft);box-shadow:0 0 0 1px #2563eb20}.nav-item .label{min-width:0;flex:1}.nav-item .label strong,.nav-item .label small{display:block;overflow:hidden;text-overflow:ellipsis}.nav-item .label small{margin-top:1px;color:var(--muted);font-size:10.5px;font-weight:400}.badge{padding:1px 6px;border-radius:10px;background:#eef2ff;color:#4338ca;font-size:10px;white-space:nowrap}.section-label{margin:11px 2px 5px;color:var(--muted);font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase}.empty{padding:22px 10px;text-align:center;color:var(--muted)}
    details.tree{border:1px solid var(--line);border-radius:7px;background:#fff;margin-bottom:5px}details.tree>summary{padding:7px;cursor:pointer;font-weight:600}.tree-items{padding:0 5px 6px 14px;display:grid;gap:4px}.tree-row{display:flex;align-items:center;gap:5px;padding:5px 6px;border-radius:5px;cursor:pointer}.tree-row:hover{background:#f1f5f9}.tree-row.active{background:#dbeafe;color:#1d4ed8}.tree-row .grow{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .property{display:grid;gap:9px}.property label{display:grid;gap:4px;color:var(--muted);font-size:11px}.property input,.property select,.property textarea{width:100%;padding:7px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink)}.property textarea{min-height:78px;resize:vertical}.button-row{display:flex;flex-wrap:wrap;gap:6px}.hint{padding:8px;border-radius:7px;background:#f1f5f9;color:var(--muted);font-size:11px}.warning{background:#fff7ed;color:#9a3412}.source-list{display:grid;gap:4px}.source-row{display:flex;align-items:center;gap:5px;padding:6px;border:1px solid var(--line);border-radius:6px;cursor:pointer}.source-row.active{border-color:var(--blue);background:var(--blue-soft)}
    .row-picker{max-height:230px;overflow:auto;border:1px solid var(--line);border-radius:6px}.row-picker label{display:flex;align-items:center;gap:6px;padding:6px 8px;border-bottom:1px solid #edf0f4;color:var(--ink);cursor:pointer}.row-picker label:last-child{border-bottom:0}.row-picker input{width:auto}
    .preview{border-top:1px solid var(--line);background:#f8fafc}.preview summary{padding:8px 10px;cursor:pointer;font-weight:600}.preview pre{max-height:220px;margin:0;padding:10px;overflow:auto;border-top:1px solid var(--line);font:11px/1.4 Consolas,monospace;white-space:pre-wrap}
    dialog{border:0;border-radius:10px;padding:0;box-shadow:0 20px 55px #0f172a55}dialog::backdrop{background:#0f172a66}.dialog-body{width:360px;padding:18px}.dialog-body h3{margin:0 0 13px}.dialog-body input{width:100%;padding:8px;border:1px solid var(--line);border-radius:6px}.dialog-actions{display:flex;justify-content:flex-end;gap:7px;margin-top:14px}.toast{display:none;position:fixed;z-index:20;right:18px;bottom:18px;max-width:440px;padding:10px 13px;border-radius:8px;background:#111827;color:#fff;box-shadow:0 8px 28px #0004}.toast.error{background:#991b1b}
    @media(max-width:1050px){.layout{grid-template-columns:1fr}.column.pdf-column{display:none}.browser{grid-template-columns:1fr 1.15fr 1.25fr}}
  </style>
</head>
<body>
  <header>
    <h1>Оцифровка PDF</h1>
    <input id="sourceInput" placeholder="Путь к PDF или blob URL">
    <button id="openSource">Открыть</button>
    <button id="openFile" class="secondary">Выбрать PDF</button>
    <span id="ocrState" class="ocr-state">OCR…</span>
    <span id="status" class="header-status">Выберите документ</span>
  </header>

  <main class="layout">
    <section class="column pdf-column">
      <div class="toolbar">
        <strong id="documentName">PDF</strong><span class="grow"></span>
        <button id="zoomOut" class="secondary icon">−</button><span id="zoomLabel">100%</span><button id="zoomIn" class="secondary icon">+</button>
      </div>
      <div id="pdfView" class="pdf-view scroll"><div class="empty">Откройте PDF</div></div>
    </section>

    <section class="column">
      <div class="toolbar">
        <select id="templateSelect"><option value="">Без шаблона</option></select>
        <button id="applyTemplate" class="secondary">Применить</button>
        <button id="saveTemplate" class="secondary">Сохранить шаблон</button>
        <span class="grow"></span>
        <button id="exportJson" class="secondary" disabled>JSON</button>
        <button id="saveDocument" disabled>Сохранить</button>
      </div>
      <div id="pendingBanner" class="pending-banner">
        <span class="pending-dot"></span><strong>Область выделена</strong>
        <span class="muted">Выберите существующий объект или создайте новый</span><span class="grow"></span>
        <button id="cancelPending" class="secondary">Отмена</button>
      </div>
      <div class="browser">
        <section class="browser-col">
          <div class="col-head"><span id="objectsTitle">Объекты</span><span class="grow"></span><span id="objectCount" class="badge">0</span></div>
          <div id="objectsColumn" class="col-body"></div>
        </section>
        <section class="browser-col">
          <div class="col-head" id="structureTitle">Структура</div>
          <div id="structureColumn" class="col-body"></div>
        </section>
        <section class="browser-col">
          <div class="col-head">Свойства и значение</div>
          <div id="propertiesColumn" class="col-body"></div>
        </section>
      </div>
      <details class="preview"><summary>Итоговые данные JSON</summary><pre id="jsonPreview">{}</pre></details>
    </section>
  </main>

  <dialog id="templateDialog"><div class="dialog-body"><h3>Сохранить шаблон</h3><input id="templateName" placeholder="Название шаблона"><div class="dialog-actions"><button id="templateCancel" class="secondary">Отмена</button><button id="templateOk">Сохранить</button></div></div></dialog>
  <div id="toast" class="toast"></div>

  <script>
    const $=id=>document.getElementById(id),uid=()=>crypto.randomUUID().replaceAll('-','');
    const state={source:'',doc:null,catalog:[],ocr:{status:'unknown',capabilities:[]},zoom:1,pending:null,selected:null,selectedObject:null,showPresets:false,dirty:false,tasks:new Set(),draw:null,lastGroupRow:-1};
    const modeNames={text:'Обычный текст',seal:'Текст печати',formula:'Формула',text_seal:'Текст + печать',text_formula:'Текст + формула',none:'Без OCR / вручную'};
    const statusNames={pending:'не распознано',queued:'в очереди',running:'распознаётся',recognized:'распознано',modified:'изменено',error:'ошибка'};
    async function api(url,options={}){const headers=options.body?{'Content-Type':'application/json'}:{};const response=await fetch(url,{...options,headers:{...headers,...(options.headers||{})}});const type=response.headers.get('content-type')||'';const data=type.includes('json')?await response.json():await response.text();if(!response.ok)throw new Error(data.detail||data||`HTTP ${response.status}`);return data}
    function toast(message,error=false){const box=$('toast');box.textContent=message;box.className=`toast${error?' error':''}`;box.style.display='block';clearTimeout(box.timer);box.timer=setTimeout(()=>box.style.display='none',5000)}
    function setStatus(value){$('status').textContent=value}
    function markDirty(){state.dirty=true;$('saveDocument').disabled=false;refreshPreview()}
    function escapeHtml(value){return String(value??'').replace(/[&<>"]/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[char]))}
    function slug(value){return String(value||'value').trim().toLowerCase().replace(/[^\p{L}\p{N}_-]+/gu,'_').replace(/^_+|_+$/g,'')||'value'}
    function uniqueObjectKey(base){const used=new Set((state.doc?.objects||[]).map(x=>x.key));let key=slug(base),candidate=key,index=2;while(used.has(candidate))candidate=`${key}_${index++}`;return candidate}
    function fieldTemplate(key,name,ocrMode='text'){return{id:uid(),key,name,ocrMode,orientation:0,value:'',sources:[]}}
    function sourceTemplate(page,rect,kind='region',orientation=0){return{id:uid(),kind,page,rect,orientation,properties:{useLlm:false,prompt:''},status:'pending',output:null,error:null}}
    function selectedObject(){return state.doc?.objects.find(item=>item.id===state.selectedObject)||null}
    function selection(){if(!state.selected)return null;const obj=state.doc?.objects.find(x=>x.id===state.selected.objectId);if(!obj)return null;const kind=state.selected.kind,id=state.selected.id;if(kind==='object')return{obj,item:obj,kind};if(kind==='field')return{obj,item:obj.fields?.find(x=>x.id===id),kind};if(kind==='column')return{obj,item:obj.columns?.find(x=>x.id===id),kind};if(kind==='group')return{obj,item:obj.groups?.find(x=>x.id===id),kind};if(kind==='block')return{obj,item:obj.blocks?.find(x=>x.id===id),kind};if(kind==='row')return{obj,item:obj.rows?.find(x=>x.id===id),kind};if(kind==='cell'){for(const row of obj.rows||[]){const item=row.cells?.find(x=>x.id===id);if(item)return{obj,row,item,kind,column:obj.columns.find(x=>x.id===item.columnId)}}}if(kind==='source'){for(const owner of [...(obj.fields||[]),...(obj.columns||[]),...(obj.groups||[])]){const item=owner.sources?.find(x=>x.id===id);if(item)return{obj,owner,item,kind,modeOwner:owner}}for(const row of obj.rows||[])for(const owner of row.cells||[]){const item=owner.sources?.find(x=>x.id===id);if(item){const column=obj.columns.find(x=>x.id===owner.columnId);return{obj,row,owner,item,kind,column,modeOwner:column}}}for(const block of obj.blocks||[])if(block.region?.id===id)return{obj,owner:block,item:block.region,kind:'blockSource'}}return null}
    function select(kind,objectId,id=objectId){state.selectedObject=objectId;state.selected={kind,objectId,id};state.showPresets=false;renderAll();const found=selection();const page=found?.item?.page||found?.item?.region?.page;document.querySelector(`.pdf-page[data-page="${page}"]`)?.scrollIntoView({behavior:'smooth',block:'center'})}

    async function loadCatalog(){try{const result=await api('/api/catalog');state.catalog=result.presets||[];state.ocr=result.ocr||{};const cap=(state.ocr.capabilities||[]).join(', ');$('ocrState').textContent=state.ocr.status==='ready'?`OCR: ${cap||'готов'}`:'OCR недоступен';$('ocrState').classList.toggle('ready',state.ocr.status==='ready')}catch(error){$('ocrState').textContent='OCR недоступен';toast(error.message,true)}}
    async function openSource(source){if(!source)return;try{setStatus('Открытие…');const payload=await api(`/api/document?source=${encodeURIComponent(source)}`);state.source=payload.source;state.doc=payload.document;state.selectedObject=state.doc.objects[0]?.id||null;state.selected=state.selectedObject?{kind:'object',objectId:state.selectedObject,id:state.selectedObject}:null;state.pending=null;state.dirty=false;$('sourceInput').value=state.source;$('documentName').textContent=payload.name;$('saveDocument').disabled=true;$('exportJson').disabled=false;renderAll();await loadTemplates();setStatus(`${state.doc.pageCount} стр. · ${state.doc.objects.length} объектов${state.doc.migratedFromSchema?' · старая разметка перенесена':''}`)}catch(error){toast(error.message,true);setStatus('Ошибка открытия')}}
    async function openDialog(){try{const value=await api('/api/open/dialog',{method:'POST',body:'{}'});if(!value.cancelled)openSource(value.source)}catch(error){toast(error.message,true)}}

    function createFromPreset(preset){const type=preset.type||'record';const count=(state.doc.objects||[]).filter(x=>x.preset===preset.id).length+1;const name=count===1?preset.name:`${preset.name} ${count}`;const obj={id:uid(),type,preset:preset.id,name,key:uniqueObjectKey(preset.id),orientation:0};if(type==='record')obj.fields=(preset.fields||[]).map(x=>fieldTemplate(x.key,x.name,x.ocrMode));else Object.assign(obj,{columns:[],rows:[],blocks:[],groups:[]});state.doc.objects.push(obj);state.selectedObject=obj.id;state.selected={kind:'object',objectId:obj.id,id:obj.id};state.showPresets=false;markDirty();if(state.pending&&type==='record'&&obj.fields.length===1)attachToField(obj,obj.fields[0]);else renderAll()}
    function deleteObject(obj){if(!confirm(`Удалить объект «${obj.name}» и всю его разметку?`))return;state.doc.objects=state.doc.objects.filter(x=>x.id!==obj.id);state.selectedObject=state.doc.objects[0]?.id||null;state.selected=state.selectedObject?{kind:'object',objectId:state.selectedObject,id:state.selectedObject}:null;markDirty();renderAll()}
    function createCustomField(obj){const number=(obj.fields?.length||0)+1;const field=fieldTemplate(`field_${number}`,`Поле ${number}`,'text');obj.fields.push(field);markDirty();if(state.pending)attachToField(obj,field);else select('field',obj.id,field.id)}

    function attachToField(obj,field){if(!state.pending)return;const source=sourceTemplate(state.pending.page,state.pending.rect,'region',field.orientation||obj.orientation||0);field.sources.push(source);state.pending=null;state.selectedObject=obj.id;state.selected={kind:'source',objectId:obj.id,id:source.id};markDirty();renderAll();setStatus('Область присоединена. Проверьте ориентацию и запустите OCR.')}
    function attachToCell(obj,row,cell){if(!state.pending)return;const column=obj.columns.find(x=>x.id===cell.columnId),orientation=cell.orientation??column?.orientation??obj.orientation??0,source=sourceTemplate(state.pending.page,state.pending.rect,'region',orientation);cell.sources=cell.sources||[];cell.sources.push(source);state.pending=null;state.selectedObject=obj.id;state.selected={kind:'source',objectId:obj.id,id:source.id};markDirty();renderAll();setStatus('Область добавлена к ячейке. Проверьте ориентацию и запустите OCR.')}
    function addTableColumn(obj,withPending=false){const index=obj.columns.length+1;const column=fieldTemplate(`column_${index}`,`Заголовок ${index}`,'text');column.value=withPending?'':column.name;if(withPending&&state.pending){column.sources.push(sourceTemplate(state.pending.page,state.pending.rect,'region',0));state.pending=null;state.selected={kind:'source',objectId:obj.id,id:column.sources[0].id}}else state.selected={kind:'column',objectId:obj.id,id:column.id};obj.columns.push(column);for(const block of obj.blocks||[]){block.grid.columns=equalCuts(obj.columns.length);syncBlock(obj,block)}state.selectedObject=obj.id;markDirty();renderAll()}
    function addTableGroup(obj,withPending=false){const index=obj.groups.length+1;const group=fieldTemplate(`group_${index}`,`Группа ${index}`,'text');group.rowIds=[];if(withPending&&state.pending){group.sources.push(sourceTemplate(state.pending.page,state.pending.rect,'region',0));state.pending=null;state.selected={kind:'source',objectId:obj.id,id:group.sources[0].id}}else state.selected={kind:'group',objectId:obj.id,id:group.id};obj.groups.push(group);state.selectedObject=obj.id;markDirty();renderAll()}
    function equalCuts(count){const values=[];for(let i=1;i<count;i++)values.push(Number((i/count).toFixed(5)));return values}
    function attachTableBlock(obj){if(!state.pending)return;if(!obj.columns.length){toast('Сначала добавьте хотя бы один заголовок таблицы',true);return}const blockId=uid(),region=sourceTemplate(state.pending.page,state.pending.rect,'table_block',0);const block={id:blockId,name:`Блок строк ${obj.blocks.length+1}`,region,grid:{columns:equalCuts(obj.columns.length),rows:[]},rowIds:[]};obj.blocks.push(block);syncBlock(obj,block);state.pending=null;state.selectedObject=obj.id;state.selected={kind:'block',objectId:obj.id,id:block.id};markDirty();renderAll();setStatus('Настройте линии сетки, затем нажмите «Распознать блок».')}
    function syncBlock(obj,block){const count=(block.grid.rows||[]).length+1;const current=(obj.rows||[]).filter(x=>x.blockId===block.id),other=(obj.rows||[]).filter(x=>x.blockId!==block.id),rows=[];for(let i=0;i<count;i++){const row=current[i]||{id:uid(),blockId:block.id,cells:[]};const existing=new Map((row.cells||[]).map(x=>[x.columnId,x]));row.cells=obj.columns.map(column=>existing.get(column.id)||{id:uid(),columnId:column.id,value:'',orientation:null,sources:[]});rows.push(row)}obj.rows=[...other,...rows];block.rowIds=rows.map(x=>x.id);const valid=new Set(obj.rows.map(x=>x.id));for(const group of obj.groups||[])group.rowIds=(group.rowIds||[]).filter(x=>valid.has(x))}
    function addManualRow(obj){if(!obj.columns.length){toast('Сначала добавьте хотя бы один заголовок таблицы',true);return}const row={id:uid(),blockId:null,cells:obj.columns.map(column=>({id:uid(),columnId:column.id,value:'',orientation:null,sources:[]}))};obj.rows.push(row);markDirty();select('row',obj.id,row.id)}

    function renderObjects(){const root=$('objectsColumn');root.replaceChildren();$('objectCount').textContent=state.doc?.objects.length||0;if(!state.doc){root.innerHTML='<div class="empty">Откройте PDF</div>';return}const list=document.createElement('div');list.className='nav-list';for(const obj of state.doc.objects){const button=document.createElement('button');button.className=`nav-item${obj.id===state.selectedObject&&!state.showPresets?' active':''}`;button.innerHTML=`<span>${obj.type==='table'?'▦':'◇'}</span><span class="label"><strong>${escapeHtml(obj.name)}</strong><small>${obj.type==='table'?'таблица':`${obj.fields?.length||0} полей`}</small></span>`;button.onclick=()=>{state.selectedObject=obj.id;state.selected={kind:'object',objectId:obj.id,id:obj.id};state.showPresets=false;renderAll()};list.append(button)}const create=document.createElement('button');create.className=`nav-item${state.showPresets?' active':''}`;create.innerHTML='<span>＋</span><span class="label"><strong>Создать новый объект</strong><small>Выбрать типовой объект</small></span>';create.onclick=()=>{state.showPresets=true;state.selected=null;renderAll()};list.append(create);root.append(list)}

    function renderSourceProperties(form,found){const source=found.item,owner=found.owner,modeOwner=found.modeOwner||owner,mode=modeOwner?.ocrMode||source.properties?.ocrMode||'text',ownerName=modeOwner?.name||'Ячейка таблицы';const title=document.createElement('div');title.className='hint';title.innerHTML=`<strong>${escapeHtml(ownerName)}</strong><br>стр. ${source.page} · ${escapeHtml(statusNames[source.status]||source.status)}`;form.append(title);form.append(selectInput('Ориентация фрагмента',source.orientation||0,[[0,'0° — горизонтально'],[90,'90° вправо'],[180,'180°'],[270,'270° влево']],value=>{source.orientation=Number(value);markDirty();renderPdf()}));const required=mode.includes('seal')?'seal':mode.includes('formula')?'formula':mode==='none'?null:'text';const unavailable=required&&state.ocr.status==='ready'&&!(state.ocr.capabilities||[]).includes(required);if(unavailable){const warning=document.createElement('div');warning.className='hint warning';warning.textContent=`В запущенном профиле PaddleOCR нет возможности «${required}». Запустите подходящий профиль OCR.`;form.append(warning)}const llm=document.createElement('label');llm.innerHTML='<span><input type="checkbox"> Исправить результат через llama.cpp</span>';llm.querySelector('input').checked=!!source.properties?.useLlm;llm.querySelector('input').onchange=event=>{source.properties.useLlm=event.target.checked;markDirty();renderProperties()};form.append(llm);if(source.properties?.useLlm)form.append(input('Инструкция для исправления',source.properties.prompt||'',value=>{source.properties.prompt=value;markDirty()},'textarea'));if(source.error){const error=document.createElement('div');error.className='hint warning';error.textContent=source.error;form.append(error)}const buttons=document.createElement('div');buttons.className='button-row';const run=document.createElement('button');run.textContent=mode==='none'?'OCR отключён':'Распознать';run.disabled=mode==='none'||unavailable||state.tasks.has(source.id);run.     function renderPdf(){const view=$('pdfView');view.replaceChildren();if(!state.doc){view.innerHTML='<div class="empty">Откройте PDF</div>';return}for(let pageNo=1;pageNo<=state.doc.pageCount;pageNo++){const page=document.createElement('div');page.className='pdf-page';page.dataset.page=pageNo;page.style.width=`${state.zoom*100}%`;const image=document.createElement('img');image.src=`/api/pdf/page/${pageNo}?source=${encodeURIComponent(state.source)}`;image.alt=`Страница ${pageNo}`;const overlay=document.createElement('div');overlay.className='overlay';overlay.dataset.page=pageNo;overlay.addEventListener('pointerdown',startDraw);for(const entry of allRegions())if(entry.source.page===pageNo)overlay.append(renderRegion(entry));if(state.pending?.page===pageNo)overlay.append(renderPending());const number=document.createElement('span');number.className='page-no';number.textContent=`${pageNo} / ${state.doc.pageCount}`;page.append(image,overlay,number);view.append(page)}$('zoomLabel').textContent=`${Math.round(state.zoom*100)}%`}
    function renderPending(){const node=document.createElement('div'),r=state.pending.rect;node.className='region pending selected';Object.assign(node.style,{left:`${r.x*100}%`,top:`${r.y*100}%`,width:`${r.w*100}%`,height:`${r.h*100}%`});const label=document.createElement('span');label.className='region-label';label.textContent='Новая область — выберите назначение';node.append(label);return node}
    function renderRegion(entry){const {obj,owner,source}=entry,node=document.createElement('div'),r=source.rect;node.className=`region ${source.status||'pending'}${state.selected?.id===source.id?' selected':''}`;Object.assign(node.style,{left:`${r.x*100}%`,top:`${r.y*100}%`,width:`${r.w*100}%`,height:`${r.h*100}%`});node.title=source.error||`${obj.name}: ${entry.label}`;node.onclick=event=>{event.stopPropagation();select(entry.kind==='block'?'block':'source',obj.id,entry.kind==='block'?owner.id:source.id)};const label=document.createElement('span');label.className='region-label';label.textContent=`${obj.name} · ${entry.label}`;const actions=document.createElement('span');actions.className='region-actions';if(entry.kind!=='block'){const rotate=document.createElement('button');rotate.textContent='↻';rotate.title='Повернуть фрагмент для OCR';rotate.onclick=event=>{event.stopPropagation();source.orientation=((source.orientation||0)+90)%360;markDirty();renderAll()};actions.append(rotate)}const run=document.createElement('button'),mode=entry.modeOwner?.ocrMode||owner.ocrMode;run.textContent='▶';run.title=mode==='none'?'Для поля OCR отключён':'Распознать';run.disabled=mode==='none';run.onclick=event=>{event.stopPropagation();runOcr(source.id)};actions.append(run);node.append(label,actions);if(entry.kind==='block'){for(const cut of owner.grid.columns||[])node.append(gridLine('v',cut,obj,owner));for(const cut of owner.grid.rows||[])node.append(gridLine('h',cut,obj,owner))}return node}
    function gridLine(axis,value,obj,block){const line=document.createElement('span');line.className=`grid-line ${axis}`;line.style[axis==='v'?'left':'top']=`${value*100}%`;line.onpointerdown=event=>{event.stopPropagation();event.preventDefault();const host=line.parentElement,move=e=>{const box=host.getBoundingClientRect();let next=axis==='v'?(e.clientX-box.left)/box.width:(e.clientY-box.top)/box.height;next=Math.max(.025,Math.min(.975,next));const list=axis==='v'?block.grid.columns:block.grid.rows,index=list.indexOf(value);list[index]=Number(next.toFixed(5));line.style[axis==='v'?'left':'top']=`${next*100}%`};const up=()=>{window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',up);block.grid[axis==='v'?'columns':'rows'].sort((a,b)=>a-b);syncBlock(obj,block);markDirty();renderAll()};window.addEventListener('pointermove',move);window.addEventListener('pointerup',up)};if(axis==='h')line.ondblclick=event=>{event.stopPropagation();block.grid.rows=block.grid.rows.filter(x=>x!==value);syncBlock(obj,block);markDirty();renderAll()};return line}
    function startDraw(event){if(!state.doc||event.button!==0||event.target!==event.currentTarget)return;event.preventDefault();const overlay=event.currentTarget,box=overlay.getBoundingClientRect(),startX=(event.clientX-box.left)/box.width,startY=(event.clientY-box.top)/box.height,ghost=document.createElement('div');ghost.className='region pending';overlay.append(ghost);const move=e=>{const x=Math.max(0,Math.min(1,(e.clientX-box.left)/box.width)),y=Math.max(0,Math.min(1,(e.clientY-box.top)/box.height)),left=Math.min(startX,x),top=Math.min(startY,y),w=Math.abs(x-startX),h=Math.abs(y-startY);Object.assign(ghost.style,{left:`${left*100}%`,top:`${top*100}%`,width:`${w*100}%`,height:`${h*100}%`});state.draw={left,top,w,h}};const up=()=>{window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',up);ghost.remove();const d=state.draw;state.draw=null;if(!d||d.w<.008||d.h<.008)return;state.pending={page:Number(overlay.dataset.page),rect:{x:+d.left.toFixed(6),y:+d.top.toFixed(6),w:+d.w.toFixed(6),h:+d.h.toFixed(6)}};state.selected=null;if(!state.doc.objects.length)state.showPresets=true;renderAll();setStatus('Область выделена — выберите объект и назначение справа')};window.addEventListener('pointermove',move);window.addEventListener('pointerup',up)}

    function materializedData(){const data={};for(const obj of state.doc?.objects||[]){if(obj.type==='record'){const values=Object.fromEntries((obj.fields||[]).map(x=>[x.key,x.value||'']));data[obj.key]=obj.preset==='custom_field'&&obj.fields.length===1?obj.fields[0].value||'':values}else{const groupNames=(obj.groups||[]).map(x=>x.name),columnNames=(obj.columns||[]).map(x=>x.value||x.name),rows=(obj.rows||[]).map(row=>{const result={};for(const group of obj.groups||[])result[group.name]=group.rowIds.includes(row.id)?group.value||'':'';for(const column of obj.columns||[]){const cell=row.cells.find(x=>x.columnId===column.id);result[column.value||column.name]=cell?.value||''}return result});data[obj.key]={columns:[...groupNames,...columnNames],rows}}}return data}
    function refreshPreview(){if(state.doc){state.doc.data=materializedData();$('jsonPreview').textContent=JSON.stringify(state.doc.data,null,2)}else $('jsonPreview').textContent='{}'}
    function renderAll(){$('pendingBanner').classList.toggle('active',!!state.pending);renderObjects();renderStructure();renderProperties();renderPdf();refreshPreview()}

    async function saveDocument(silent=false){if(!state.doc)return;try{state.doc.data=materializedData();const result=await api('/api/document',{method:'PUT',body:JSON.stringify({source:state.source,document:state.doc})});state.doc=result.document;state.dirty=false;$('saveDocument').disabled=true;if(!silent)toast(`Сохранено рядом с PDF: ${result.path}`);setStatus('Разметка и JSON сохранены')}catch(error){toast(error.message,true);throw error}}
    async function runOcr(regionId){try{await saveDocument(true);state.tasks.add(regionId);const entry=allRegions().find(x=>x.source.id===regionId);if(entry)entry.source.status='queued';renderAll();const result=await api('/api/ocr',{method:'POST',body:JSON.stringify({source:state.source,regionId})});pollTask(result.taskId,regionId)}catch(error){state.tasks.delete(regionId);toast(error.message,true)}}
    async function pollTask(taskId,regionId){try{const result=await api(`/api/tasks/${taskId}`);if(result.state==='done'){state.tasks.delete(regionId);state.doc=result.document;state.dirty=false;renderAll();setStatus('OCR области завершён');return}if(result.state==='failed')throw new Error(result.error||'Ошибка OCR');setTimeout(()=>pollTask(taskId,regionId),700)}catch(error){state.tasks.delete(regionId);toast(error.message,true);if(state.source){const fresh=await api(`/api/document?source=${encodeURIComponent(state.source)}`);state.doc=fresh.document;renderAll()}}}
    async function loadTemplates(){try{const catalog=await api(`/api/templates?source=${encodeURIComponent(state.source)}`),select=$('templateSelect');select.innerHTML='<option value="">Без шаблона</option>';for(const template of catalog.templates||[]){const option=document.createElement('option');option.value=template.id;option.textContent=template.name;select.append(option)}if(state.doc.templateId)select.value=state.doc.templateId}catch(error){toast(error.message,true)}}
    async function applyTemplate(){const id=$('templateSelect').value;if(!id||!confirm('Текущие объекты разметки будут заменены шаблоном. Продолжить?'))return;try{const result=await api('/api/templates/apply',{method:'POST',body:JSON.stringify({source:state.source,templateId:id})});state.doc=result.document;state.selectedObject=state.doc.objects[0]?.id||null;state.selected=state.selectedObject?{kind:'object',objectId:state.selectedObject,id:state.selectedObject}:null;renderAll();toast('Шаблон применён')}catch(error){toast(error.message,true)}}
    async function confirmTemplate(){try{const catalog=await api('/api/templates',{method:'POST',body:JSON.stringify({source:state.source,name:$('templateName').value,document:state.doc})});$('templateDialog').close();await loadTemplates();$('templateSelect').value=catalog.templates.at(-1).id;toast('Шаблон сохранён рядом с PDF')}catch(error){toast(error.message,true)}}

    $('openFile').onclick=openDialog;$('openSource').onclick=()=>openSource($('sourceInput').value);$('sourceInput').onkeydown=e=>{if(e.key==='Enter')openSource(e.currentTarget.value)};$('cancelPending').onclick=()=>{state.pending=null;renderAll();setStatus('Выделение отменено')};
    $('saveDocument').onclick=()=>saveDocument();$('exportJson').onclick=()=>{if(state.source)location.href=`/api/export?source=${encodeURIComponent(state.source)}`};$('applyTemplate').onclick=applyTemplate;$('saveTemplate').onclick=()=>{if(state.doc){$('templateName').value='';$('templateDialog').showModal();$('templateName').focus()}};$('templateCancel').onclick=()=>$('templateDialog').close();$('templateOk').onclick=confirmTemplate;
    $('zoomIn').onclick=()=>{state.zoom=Math.min(1.8,state.zoom+.1);renderPdf()};$('zoomOut').onclick=()=>{state.zoom=Math.max(.6,state.zoom-.1);renderPdf()};window.addEventListener('beforeunload',event=>{if(state.dirty){event.preventDefault();event.returnValue=''}});
    loadCatalog();const query=new URLSearchParams(location.search),initial=query.get('source')||query.get('path')||query.get('blob');if(initial){$('sourceInput').value=initial;openSource(initial)}
  </script>
</body>
