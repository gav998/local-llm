<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Оцифровка PDF</title>
  <style>
    :root{--bg:#eef1f5;--panel:#fff;--line:#d7dce4;--ink:#172033;--muted:#667085;--blue:#2563eb;--blue-soft:#eff6ff;--green:#16855b;--amber:#d97706;--red:#dc2626;--violet:#7c3aed}
    *{box-sizing:border-box}html,body{height:100%;margin:0;font:13px/1.42 Inter,Segoe UI,Arial,sans-serif;color:var(--ink);background:var(--bg)}
    button,input,select,textarea{font:inherit}button{border:0;border-radius:7px;padding:7px 10px;background:var(--blue);color:#fff;cursor:pointer}button:hover{filter:brightness(.97)}button:disabled{opacity:.42;cursor:default}.secondary{background:#f7f8fa;color:#253044;border:1px solid var(--line)}.danger{background:var(--red)}.ghost{background:transparent;color:var(--ink)}.icon{padding:3px 7px;min-width:28px}.full{width:100%}.muted{color:var(--muted)}
    header{height:56px;display:flex;align-items:center;gap:8px;padding:8px 12px;background:#111827;color:#fff}header h1{font-size:15px;margin:0 8px 0 0;white-space:nowrap}header input{min-width:220px;flex:1;padding:8px;border:1px solid #4b5563;border-radius:7px;background:#1f2937;color:#fff}.header-status{max-width:330px;color:#cbd5e1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ocr-state{padding:3px 8px;border:1px solid #475569;border-radius:12px;color:#cbd5e1;font-size:11px;white-space:nowrap}.ocr-state.ready{border-color:#059669;color:#a7f3d0}
    .layout{height:calc(100% - 56px);display:grid;grid-template-columns:minmax(520px,1fr) 248px minmax(340px,420px);gap:1px;background:var(--line)}.column{min-width:0;min-height:0;display:flex;flex-direction:column;background:var(--panel)}
    .toolbar{min-height:48px;display:flex;align-items:center;gap:7px;padding:7px 9px;border-bottom:1px solid var(--line)}.toolbar strong{white-space:nowrap}.toolbar select,.toolbar input{min-width:0;padding:6px;border:1px solid var(--line);border-radius:6px;background:#fff}.grow{flex:1}.scroll{overflow:auto;min-height:0;flex:1}
    .pdf-view{padding:18px;background:#cbd2dc;user-select:none}.pdf-page{position:relative;max-width:950px;margin:0 auto 18px;background:#fff;box-shadow:0 3px 14px #33415545}.pdf-page>img{display:block;width:100%;pointer-events:none}.overlay{position:absolute;inset:0;cursor:crosshair}.page-no{position:absolute;right:7px;bottom:6px;padding:2px 7px;border-radius:10px;background:#111827cc;color:#fff;font-size:11px;pointer-events:none}
    .region{position:absolute;border:2px solid var(--blue);background:#2563eb14;cursor:move;touch-action:none}.region.pending{border-color:#64748b}.region.queued,.region.running{border-color:var(--amber);background:#f59e0b17}.region.recognized{border-color:var(--green);background:#10b98114}.region.modified,.region.error{border-color:var(--red);background:#ef44441a}.region.selected{outline:2px solid #fff;box-shadow:0 0 0 4px #0f172a99}.region-label{position:absolute;left:-2px;bottom:100%;max-width:280px;padding:2px 6px;border-radius:5px 5px 0 0;color:#fff;background:#1e40af;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}.region-status{position:absolute;left:-2px;bottom:calc(100% + 19px);max-width:300px;padding:2px 6px;border-radius:5px;color:#fff;font-size:10px;line-height:15px;white-space:nowrap;box-shadow:0 2px 7px #0003;pointer-events:none}.region-status.red{background:var(--red)}.region-status.yellow{background:var(--amber)}.region-status.green{background:var(--green)}.region-actions{display:none;position:absolute;right:2px;top:2px;gap:3px;z-index:5}.region:hover .region-actions,.region.selected .region-actions{display:flex}.region-actions button{padding:2px 5px;background:#111827e8;font-size:12px}.resize-handle{display:none;position:absolute;width:9px;height:9px;border:1px solid #fff;background:#111827;z-index:6}.region:hover .resize-handle,.region.selected .resize-handle{display:block}.resize-handle.nw{left:-6px;top:-6px;cursor:nwse-resize}.resize-handle.ne{right:-6px;top:-6px;cursor:nesw-resize}.resize-handle.sw{left:-6px;bottom:-6px;cursor:nesw-resize}.resize-handle.se{right:-6px;bottom:-6px;cursor:nwse-resize}.grid-line{position:absolute;background:#f43f5e;z-index:2}.grid-line.v{top:0;bottom:0;width:2px;cursor:col-resize}.grid-line.h{left:0;right:0;height:2px;cursor:row-resize}
    .pending-banner{display:none;padding:10px 12px;background:#fff7ed;border-bottom:1px solid #fed7aa}.pending-banner.active{display:flex;align-items:center;gap:9px}.pending-dot{width:10px;height:10px;border-radius:50%;background:var(--amber)}
    .browser{display:grid;grid-template-columns:minmax(250px,.9fr) minmax(300px,1.1fr);min-height:0;flex:1}.browser-col{min-width:0;overflow:auto;border-right:1px solid var(--line);background:#fff}.browser-col:last-child{border-right:0}.col-head{position:sticky;top:0;z-index:3;display:flex;align-items:center;gap:5px;min-height:39px;padding:7px 9px;border-bottom:1px solid var(--line);background:#f8fafc;font-weight:650}.col-body{padding:7px}.nav-list{display:grid;gap:4px}.nav-item{display:flex;align-items:center;gap:6px;width:100%;min-height:33px;padding:5px 6px;text-align:left;background:#fff;color:var(--ink);border:1px solid var(--line)}.nav-item:hover{border-color:#93b4f8}.nav-item.active{border-color:var(--blue);background:var(--blue-soft);box-shadow:0 0 0 1px #2563eb20}.nav-item.dragging{opacity:.4}.nav-item.drop-before{box-shadow:0 -3px 0 var(--blue)}.nav-item .label{min-width:0;flex:1}.nav-item .label strong,.nav-item .label small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.nav-item .label small{margin-top:1px;color:var(--muted);font-size:10px;font-weight:400}.drag-grip{color:#94a3b8;cursor:grab}.object-tools{display:flex;gap:2px}.object-tools button{padding:2px 4px;color:var(--muted);background:transparent}.badge{padding:1px 6px;border-radius:10px;background:#eef2ff;color:#4338ca;font-size:10px;white-space:nowrap}.section-label{margin:11px 2px 5px;color:var(--muted);font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase}.empty{padding:22px 10px;text-align:center;color:var(--muted)}
    details.tree{border:1px solid var(--line);border-radius:7px;background:#fff;margin-bottom:5px}details.tree>summary{padding:7px;cursor:pointer;font-weight:600}.tree-items{padding:0 5px 6px 14px;display:grid;gap:4px}.tree-row{display:flex;align-items:center;gap:5px;padding:5px 6px;border-radius:5px;cursor:pointer}.tree-row:hover{background:#f1f5f9}.tree-row.active{background:#dbeafe;color:#1d4ed8}.tree-row .grow{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .property{display:grid;gap:9px}.property label{display:grid;gap:4px;color:var(--muted);font-size:11px}.property input,.property select,.property textarea{width:100%;padding:7px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink)}.property textarea{min-height:78px;resize:vertical}.button-row{display:flex;flex-wrap:wrap;gap:6px}.hint{padding:8px;border-radius:7px;background:#f1f5f9;color:var(--muted);font-size:11px}.warning{background:#fff7ed;color:#9a3412}.source-list{display:grid;gap:4px}.source-row{display:flex;align-items:center;gap:5px;padding:6px;border:1px solid var(--line);border-radius:6px;cursor:pointer}.source-row.active{border-color:var(--blue);background:var(--blue-soft)}
    .row-picker{max-height:230px;overflow:auto;border:1px solid var(--line);border-radius:6px}.row-picker label{display:flex;align-items:center;gap:6px;padding:6px 8px;border-bottom:1px solid #edf0f4;color:var(--ink);cursor:pointer}.row-picker label:last-child{border-bottom:0}.row-picker input{width:auto}
    .order-column .toolbar{align-items:flex-start;flex-direction:column}.order-actions{display:flex;width:100%;gap:4px}.order-actions select{flex:1}.object-scroll{overflow-y:auto;overflow-x:hidden;min-height:0;flex:1;padding:6px}.order-help{padding:7px 9px;border-top:1px solid var(--line);font-size:10px;color:var(--muted)}
    .preview-column{background:#f8fafc}.preview-scroll{overflow:auto;min-height:0;flex:1;padding:10px}.preview-flow{display:grid;gap:9px}.preview-card{padding:10px;border:1px solid var(--line);border-radius:8px;background:#fff;box-shadow:0 1px 2px #0f172a0b;scroll-margin:65px}.preview-card.active{border-color:var(--blue);box-shadow:0 0 0 2px #2563eb20}.preview-card h3{margin:0 0 8px;font-size:13px}.preview-field{display:grid;gap:3px;margin-top:7px}.preview-field label{font-size:10px;font-weight:650;color:var(--muted)}.preview-field textarea{width:100%;min-height:46px;padding:6px;border:1px solid var(--line);border-radius:5px;resize:vertical;background:#fff}.preview-field textarea:focus{border-color:var(--blue);outline:2px solid #2563eb20}.preview-table{width:100%;border-collapse:collapse;font-size:11px}.preview-table th,.preview-table td{padding:4px;border:1px solid var(--line);vertical-align:top}.preview-table textarea{width:100%;min-width:80px;border:0;resize:vertical}.empty-value{color:#9ca3af;font-style:italic}
    .context-menu{display:none;position:fixed;z-index:50;min-width:178px;max-width:240px;max-height:min(72vh,560px);overflow-y:auto;overflow-x:visible;padding:3px;border:1px solid #cbd5e1;border-radius:5px;background:#fff;box-shadow:0 10px 30px #0f172a38;font-size:11px}.context-menu.open{display:block}.menu-list{display:grid;gap:1px}.menu-entry{position:relative}.menu-item{display:flex;align-items:center;gap:8px;width:100%;min-height:27px;padding:4px 7px;border-radius:3px;background:#fff;color:var(--ink);text-align:left;white-space:nowrap}.menu-item>span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis}.menu-item:hover,.menu-entry:focus-within>.menu-item{background:#e8f0fe}.menu-arrow{margin-left:auto;color:#64748b}.submenu{display:none;position:fixed;z-index:51;min-width:185px;max-width:255px;max-height:min(72vh,560px);overflow-y:auto;padding:3px;border:1px solid #cbd5e1;border-radius:5px;background:#fff;box-shadow:0 10px 30px #0f172a38}.menu-entry:hover>.submenu,.menu-entry:focus-within>.submenu{display:grid;gap:1px}.menu-separator{height:1px;margin:3px;background:#e5e7eb}
    .inspector{position:fixed;z-index:40;right:18px;top:70px;width:min(720px,calc(100vw - 36px));height:min(720px,calc(100vh - 88px));display:none;flex-direction:column;border:1px solid var(--line);border-radius:10px;background:#fff;box-shadow:0 20px 60px #0f172a4d}.inspector.open{display:flex}.inspector-head{display:flex;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line);font-weight:700}.inspector .browser{min-height:0}.inspector-close{margin-left:auto;background:transparent;color:var(--ink);font-size:18px;padding:2px 7px}
    dialog{border:0;border-radius:10px;padding:0;box-shadow:0 20px 55px #0f172a55}dialog::backdrop{background:#0f172a66}.dialog-body{width:360px;padding:18px}.dialog-body h3{margin:0 0 13px}.dialog-body input{width:100%;padding:8px;border:1px solid var(--line);border-radius:6px}.dialog-actions{display:flex;justify-content:flex-end;gap:7px;margin-top:14px}.toast{display:none;position:fixed;z-index:70;right:18px;bottom:18px;max-width:440px;padding:10px 13px;border-radius:8px;background:#111827;color:#fff;box-shadow:0 8px 28px #0004}.toast.error{background:#991b1b}
    @media(max-width:1180px){.layout{grid-template-columns:minmax(460px,1fr) 220px minmax(300px,360px)}}@media(max-width:900px){.layout{grid-template-columns:1fr 220px}.preview-column{display:none}}@media(max-width:680px){.layout{grid-template-columns:1fr}.order-column{display:none}}
  </style>
</head>
<body>
  <header>
    <h1>Оцифровка PDF</h1>
    <input id="sourceInput" placeholder="Путь к PDF или blob URL">
    <button id="openSource">Открыть</button>
    <button id="openFile" class="secondary">Выбрать PDF</button>
    <span id="ocrState" class="ocr-state">OCR…</span>
    <span id="status" class="header-status">Выберите документ</span>
  </header>

  <main class="layout">
    <section class="column pdf-column">
      <div class="toolbar">
        <strong id="documentName">PDF</strong><span class="grow"></span>
        <button id="zoomOut" class="secondary icon">−</button><span id="zoomLabel">100%</span><button id="zoomIn" class="secondary icon">+</button>
      </div>
      <div id="pdfView" class="pdf-view scroll"><div class="empty">Откройте PDF</div></div>
    </section>

    <section class="column order-column">
      <div class="toolbar">
        <strong>Порядок объектов</strong>
        <div class="order-actions"><select id="templateSelect"><option value="">Без шаблона</option></select><button id="applyTemplate" class="secondary" title="Применить шаблон">↥</button><button id="saveTemplate" class="secondary" title="Сохранить шаблон">＋</button></div>
      </div>
      <div class="col-head"><span>Объекты</span><span class="grow"></span><span id="objectCount" class="badge">0</span></div>
      <div id="objectsColumn" class="object-scroll"></div>
      <div class="order-help">Перетаскивайте объекты — этот порядок используется в предпросмотре и JSON.</div>
    </section>

    <section class="column preview-column">
      <div class="toolbar"><strong>Предпросмотр</strong><span class="grow"></span><button id="exportJson" class="secondary" disabled>JSON</button><button id="saveDocument" disabled>Сохранить</button></div>
      <div id="previewScroll" class="preview-scroll"><div id="previewContent" class="preview-flow"><div class="empty">Распознанные объекты появятся здесь</div></div></div>
      <pre id="jsonPreview" hidden>{}</pre>
    </section>
  </main>

  <div id="pendingBanner" hidden><button id="cancelPending">Отмена</button></div>
  <div id="contextMenu" class="context-menu" role="menu"></div>
  <aside id="inspector" class="inspector">
    <div class="inspector-head"><span>Настройка объекта</span><button id="inspectorClose" class="inspector-close" title="Закрыть">×</button></div>
    <div class="browser">
      <section class="browser-col"><div class="col-head" id="structureTitle">Структура объекта</div><div id="structureColumn" class="col-body"></div></section>
      <section class="browser-col"><div class="col-head">Свойства и значение</div><div id="propertiesColumn" class="col-body"></div></section>
    </div>
  </aside>

  <dialog id="templateDialog"><div class="dialog-body"><h3>Сохранить шаблон</h3><input id="templateName" placeholder="Название шаблона"><div class="dialog-actions"><button id="templateCancel" class="secondary">Отмена</button><button id="templateOk">Сохранить</button></div></div></dialog>
  <div id="toast" class="toast"></div>

  <script>
    const $=id=>document.getElementById(id),uid=()=>crypto.randomUUID().replaceAll('-','');
    const state={source:'',doc:null,catalog:[],ocr:{status:'unknown',capabilities:[]},zoom:1,pending:null,selected:null,selectedObject:null,showPresets:false,dirty:false,revision:0,tasks:new Set(),draw:null,lastGroupRow:-1,menuRegionId:null,geometryDirty:new Set(),ocrQueue:[],ocrActive:false,dragObjectId:null};
    const modeNames={text:'Обычный текст',seal:'Текст печати',formula:'Формула',text_seal:'Текст + печать',text_formula:'Текст + формула',none:'Без OCR / вручную'};
    const statusNames={pending:'OCR не выполнено',queued:'Выполняется OCR',running:'Выполняется OCR',recognized:'OCR выполнено',modified:'Блок был изменен, если необходимо повторите OCR',error:'Ошибка OCR'};
    async function api(url,options={}){const headers=options.body?{'Content-Type':'application/json'}:{};const response=await fetch(url,{...options,headers:{...headers,...(options.headers||{})}});const type=response.headers.get('content-type')||'';const data=type.includes('json')?await response.json():await response.text();if(!response.ok)throw new Error(data.detail||data||`HTTP ${response.status}`);return data}
    function toast(message,error=false){const box=$('toast');box.textContent=message;box.className=`toast${error?' error':''}`;box.style.display='block';clearTimeout(box.timer);box.timer=setTimeout(()=>box.style.display='none',5000)}
    function setStatus(value){$('status').textContent=value}
    function markDirty(){state.dirty=true;state.revision++;$('saveDocument').disabled=false;refreshPreview()}
    function escapeHtml(value){return String(value??'').replace(/[&<>"]/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[char]))}
    function slug(value){return String(value||'value').trim().toLowerCase().replace(/[^\p{L}\p{N}_-]+/gu,'_').replace(/^_+|_+$/g,'')||'value'}
    function uniqueObjectKey(base){const used=new Set((state.doc?.objects||[]).map(x=>x.key));let key=slug(base),candidate=key,index=2;while(used.has(candidate))candidate=`${key}_${index++}`;return candidate}
    function fieldTemplate(key,name,ocrMode='text'){return{id:uid(),key,name,ocrMode,orientation:0,value:'',sources:[]}}
    function sourceTemplate(page,rect,kind='region',orientation=0){return{id:uid(),kind,page,rect,orientation,properties:{useLlm:false,prompt:''},status:'pending',output:null,error:null}}
    function selectedObject(){return state.doc?.objects.find(item=>item.id===state.selectedObject)||null}
    function selection(){if(!state.selected)return null;const obj=state.doc?.objects.find(x=>x.id===state.selected.objectId);if(!obj)return null;const kind=state.selected.kind,id=state.selected.id;if(kind==='object')return{obj,item:obj,kind};if(kind==='field')return{obj,item:obj.fields?.find(x=>x.id===id),kind};if(kind==='column')return{obj,item:obj.columns?.find(x=>x.id===id),kind};if(kind==='group')return{obj,item:obj.groups?.find(x=>x.id===id),kind};if(kind==='block')return{obj,item:obj.blocks?.find(x=>x.id===id),kind};if(kind==='row')return{obj,item:obj.rows?.find(x=>x.id===id),kind};if(kind==='cell'){for(const row of obj.rows||[]){const item=row.cells?.find(x=>x.id===id);if(item)return{obj,row,item,kind,column:obj.columns.find(x=>x.id===item.columnId)}}}if(kind==='source'){for(const owner of [...(obj.fields||[]),...(obj.columns||[]),...(obj.groups||[])]){const item=owner.sources?.find(x=>x.id===id);if(item)return{obj,owner,item,kind,modeOwner:owner}}for(const row of obj.rows||[])for(const owner of row.cells||[]){const item=owner.sources?.find(x=>x.id===id);if(item){const column=obj.columns.find(x=>x.id===owner.columnId);return{obj,row,owner,item,kind,column,modeOwner:column}}}for(const block of obj.blocks||[])if(block.region?.id===id)return{obj,owner:block,item:block.region,kind:'blockSource'}}return null}
    function select(kind,objectId,id=objectId){const before=selection(),previous=before?.kind==='source'?before.item?.id:before?.kind==='block'?before.item?.region?.id:null;if(previous&&previous!==id)flushGeometryOcr(previous);state.selectedObject=objectId;state.selected={kind,objectId,id};state.showPresets=false;renderAll();const found=selection();const page=found?.item?.page||found?.item?.region?.page;document.querySelector(`.pdf-page[data-page="${page}"]`)?.scrollIntoView({behavior:'smooth',block:'center'});scrollPreviewToObject(objectId)}

    async function loadCatalog(){try{const result=await api('/api/catalog');state.catalog=result.presets||[];state.ocr=result.ocr||{};const cap=(state.ocr.capabilities||[]).join(', ');$('ocrState').textContent=state.ocr.status==='ready'?`OCR: ${cap||'готов'}`:'OCR недоступен';$('ocrState').classList.toggle('ready',state.ocr.status==='ready')}catch(error){$('ocrState').textContent='OCR недоступен';toast(error.message,true)}}
    async function openSource(source){if(!source)return;if(state.ocrActive){toast('Дождитесь завершения текущего OCR',true);return}try{setStatus('Открытие…');closeContextMenu();const payload=await api(`/api/document?source=${encodeURIComponent(source)}`);state.source=payload.source;state.doc=payload.document;state.selectedObject=state.doc.objects[0]?.id||null;state.selected=state.selectedObject?{kind:'object',objectId:state.selectedObject,id:state.selectedObject}:null;state.pending=null;state.geometryDirty.clear();state.ocrQueue=[];state.tasks.clear();state.dirty=false;state.revision=0;$('sourceInput').value=state.source;$('documentName').textContent=payload.name;$('saveDocument').disabled=true;$('exportJson').disabled=false;renderAll();await loadTemplates();setStatus(`${state.doc.pageCount} стр. · ${state.doc.objects.length} объектов${state.doc.migratedFromSchema?' · старая разметка перенесена':''}`)}catch(error){toast(error.message,true);setStatus('Ошибка открытия')}}
    async function openDialog(){try{const value=await api('/api/open/dialog',{method:'POST',body:'{}'});if(!value.cancelled)openSource(value.source)}catch(error){toast(error.message,true)}}

    function createFromPreset(preset){const type=preset.type||'record';const count=(state.doc.objects||[]).filter(x=>x.preset===preset.id).length+1;const name=count===1?preset.name:`${preset.name} ${count}`;const obj={id:uid(),type,preset:preset.id,name,key:uniqueObjectKey(preset.id),orientation:0};if(type==='record')obj.fields=(preset.fields||[]).map(x=>fieldTemplate(x.key,x.name,x.ocrMode));else Object.assign(obj,{columns:[],rows:[],blocks:[],groups:[]});state.doc.objects.push(obj);state.selectedObject=obj.id;state.selected={kind:'object',objectId:obj.id,id:obj.id};state.showPresets=false;markDirty();if(state.pending&&type==='record'&&obj.fields.length===1)attachToField(obj,obj.fields[0]);else renderAll()}
    function deleteObject(obj){if(!confirm(`Удалить объект «${obj.name}» и всю его разметку?`))return;state.doc.objects=state.doc.objects.filter(x=>x.id!==obj.id);state.selectedObject=state.doc.objects[0]?.id||null;state.selected=state.selectedObject?{kind:'object',objectId:state.selectedObject,id:state.selectedObject}:null;markDirty();renderAll()}
    function createCustomField(obj){const number=(obj.fields?.length||0)+1;const field=fieldTemplate(`field_${number}`,`Поле ${number}`,'text');obj.fields.push(field);markDirty();if(state.pending)attachToField(obj,field);else select('field',obj.id,field.id)}

    function takePendingSource(kind='region',orientation=0){const source=state.pending?.source||sourceTemplate(state.pending.page,state.pending.rect,kind,orientation);source.kind=kind;source.page=state.pending.page;source.rect={...state.pending.rect};source.orientation=source.orientation??orientation;source.status='pending';source.output=null;source.error=null;return source}

    function attachToField(obj,field){if(!state.pending)return;const source=takePendingSource('region',field.orientation||obj.orientation||0);field.sources.push(source);state.pending=null;state.selectedObject=obj.id;state.selected={kind:'source',objectId:obj.id,id:source.id};closeContextMenu();markDirty();renderAll();setStatus('Выполняется OCR');if(field.ocrMode!=='none')queueOcr(source.id)}

regionsForObject(obj)[0]?.source;if(region)document.querySelector(`.pdf-page[data-page="${region.page}"]`)?.scrollIntoView({behavior:'smooth',block:'center'})};root.append(card)}}
    function scrollPreviewToObject(objectId){const card=document.querySelector(`.preview-card[data-object-id="${objectId}"]`);if(card){document.querySelectorAll('.preview-card').forEach(x=>x.classList.toggle('active',x===card));card.scrollIntoView({behavior:'smooth',block:'nearest'})}}
    function syncPreviewFromPdf(){if(!state.doc)return;const host=$('pdfView'),nodes=[...host.querySelectorAll('.region[data-region-id]')];if(!nodes.length)return;const focus=host.getBoundingClientRect().top+90,node=nodes.reduce((best,item)=>Math.abs(item.getBoundingClientRect().top-focus)<Math.abs(best.getBoundingClientRect().top-focus)?item:best),entry=allRegions().find(item=>item.source.id===node.dataset.regionId);if(entry&&entry.obj.id!==state.selectedObject){state.selectedObject=entry.obj.id;renderObjects();scrollPreviewToObject(entry.obj.id)}}
    function refreshPreview(){if(state.doc){state.doc.data=materializedData();$('jsonPreview').textContent=JSON.stringify(state.doc.data,null,2)}else $('jsonPreview').textContent='{}'}
    function renderAll(){renderObjects();renderStructure();renderProperties();renderPdf();renderPreview();refreshPreview()}

    async function saveDocument(silent=false){if(!state.doc)return;const revision=state.revision;try{state.doc.data=materializedData();const result=await api('/api/document',{method:'PUT',body:JSON.stringify({source:state.source,document:state.doc})});if(state.revision===revision){state.doc=result.document;state.dirty=false;$('saveDocument').disabled=true}if(!silent)toast(`Сохранено рядом с PDF: ${result.path}`);if(!silent)setStatus('Разметка и JSON сохранены')}catch(error){toast(error.message,true);throw error}}
    function flushGeometryOcr(regionId){if(regionId&&state.geometryDirty.has(regionId)){state.geometryDirty.delete(regionId);queueOcr(regionId)}}
    function flushGeometryOcrExcept(regionId){for(const id of [...state.geometryDirty])if(id!==regionId)flushGeometryOcr(id)}
    function queueOcr(regionId){if(!regionId||state.tasks.has(regionId)||state.ocrQueue.includes(regionId))return;const entry=allRegions().find(x=>x.source.id===regionId);if(!entry)return;const mode=entry.kind==='block'?'text':entry.modeOwner?.ocrMode||entry.owner.ocrMode;if(mode==='none'){toast('Для этого поля OCR отключён',true);return}entry.source.status='queued';entry.source.error=null;state.ocrQueue.push(regionId);state.geometryDirty.delete(regionId);setStatus('Выполняется OCR');renderPdf();renderObjects();pumpOcrQueue()}
    function runOcr(regionId){queueOcr(regionId)}
    async function pumpOcrQueue(){if(state.ocrActive||!state.ocrQueue.length)return;const regionId=state.ocrQueue.shift();state.ocrActive=true;state.tasks.add(regionId);try{await saveDocument(true);const entry=allRegions().find(x=>x.source.id===regionId);if(entry)entry.source.status='running';setStatus('Выполняется OCR');renderPdf();const result=await api('/api/ocr',{method:'POST',body:JSON.stringify({source:state.source,regionId})});pollTask(result.taskId,regionId)}catch(error){state.tasks.delete(regionId);state.ocrActive=false;toast(error.message,true);pumpOcrQueue()}}
    function mergeOcrResult(document,regionId){let remote=null;for(const obj of document?.objects||[]){const entry=regionsForObject(obj).find(x=>x.source.id===regionId);if(entry){remote={...entry,obj};break}}const local=allRegions().find(x=>x.source.id===regionId);if(!remote||!local||local.source.status==='modified')return;if(remote.kind==='block'){local.source.status=remote.source.status;local.source.output=remote.source.output;local.source.error=remote.source.error;const remoteRows=(remote.obj.rows||[]).filter(x=>x.blockId===remote.owner.id),other=(local.obj.rows||[]).filter(x=>x.blockId!==local.owner.id);local.obj.rows=[...other,...structuredClone(remoteRows)];local.owner.rowIds=[...(remote.owner.rowIds||[])]}else{Object.assign(local.source,{status:remote.source.status,output:remote.source.output,error:remote.source.error,updated:remote.source.updated});local.owner.value=remote.owner.value}}
    async function pollTask(taskId,regionId){try{const result=await api(`/api/tasks/${taskId}`);if(result.state==='done'){state.tasks.delete(regionId);mergeOcrResult(result.document,regionId);state.ocrActive=false;const entry=allRegions().find(x=>x.source.id===regionId);renderAll();setStatus(entry?.source.status==='modified'?statusNames.modified:'OCR выполнено');pumpOcrQueue();return}if(result.state==='failed')throw new Error(result.error||'Ошибка OCR');setTimeout(()=>pollTask(taskId,regionId),700)}catch(error){state.tasks.delete(regionId);state.ocrActive=false;const entry=allRegions().find(x=>x.source.id===regionId);if(entry){entry.source.status='error';entry.source.error=error.message}setStatus('Ошибка OCR');toast(error.message,true);renderAll();pumpOcrQueue()}}
    async function loadTemplates(){try{const catalog=await api(`/api/templates?source=${encodeURIComponent(state.source)}`),select=$('templateSelect');select.innerHTML='<option value="">Без шаблона</option>';for(const template of catalog.templates||[]){const option=document.createElement('option');option.value=template.id;option.textContent=template.name;select.append(option)}if(state.doc.templateId)select.value=state.doc.templateId}catch(error){toast(error.message,true)}}
    async function applyTemplate(){const id=$('templateSelect').value;if(!id||!confirm('Текущие объекты разметки будут заменены шаблоном. Продолжить?'))return;try{const result=await api('/api/templates/apply',{method:'POST',body:JSON.stringify({source:state.source,templateId:id})});state.doc=result.document;state.selectedObject=state.doc.objects[0]?.id||null;state.selected=state.selectedObject?{kind:'object',objectId:state.selectedObject,id:state.selectedObject}:null;state.pending=null;state.geometryDirty.clear();state.ocrQueue=[];state.dirty=false;state.revision++;$('saveDocument').disabled=true;closeContextMenu();renderAll();toast('Шаблон применён')}catch(error){toast(error.message,true)}}
    async function confirmTemplate(){try{const catalog=await api('/api/templates',{method:'POST',body:JSON.stringify({source:state.source,name:$('templateName').value,document:state.doc})});$('templateDialog').close();await loadTemplates();$('templateSelect').value=catalog.templates.at(-1).id;toast('Шаблон сохранён рядом с PDF')}catch(error){toast(error.message,true)}}

    $('openFile').onclick=openDialog;$('openSource').onclick=()=>openSource($('sourceInput').value);$('sourceInput').onkeydown=e=>{if(e.key==='Enter')openSource(e.currentTarget.value)};$('cancelPending').onclick=()=>{state.pending=null;renderAll();setStatus('Выделение отменено')};
    $('saveDocument').onclick=()=>saveDocument();$('exportJson').onclick=async()=>{if(state.source){await saveDocument(true);location.href=`/api/export?source=${encodeURIComponent(state.source)}`}};$('applyTemplate').onclick=applyTemplate;$('saveTemplate').onclick=()=>{if(state.doc){$('templateName').value='';$('templateDialog').showModal();$('templateName').focus()}};$('templateCancel').onclick=()=>$('templateDialog').close();$('templateOk').onclick=confirmTemplate;
    $('zoomIn').onclick=()=>{state.zoom=Math.min(1.8,state.zoom+.1);renderPdf()};$('zoomOut').onclick=()=>{state.zoom=Math.max(.6,state.zoom-.1);renderPdf()};$('inspectorClose').onclick=()=>$('inspector').classList.remove('open');$('pdfView').addEventListener('scroll',()=>{clearTimeout(state.syncTimer);state.syncTimer=setTimeout(syncPreviewFromPdf,100)});document.addEventListener('pointerdown',event=>{if(!event.target.closest('.context-menu')&&!event.target.closest('.region'))closeContextMenu()});document.addEventListener('keydown',event=>{if(event.key==='Escape'){closeContextMenu();$('inspector').classList.remove('open')}});window.addEventListener('beforeunload',event=>{if(state.dirty){event.preventDefault();event.returnValue=''}});
    loadCatalog();const query=new URLSearchParams(location.search),initial=query.get('source')||query.get('path')||query.get('blob');if(initial){$('sourceInput').value=initial;openSource(initial)}
  </script>
</body>
