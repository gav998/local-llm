types:
  text:
    name: Текст
    fields:
      text:
        name: Текст
        prompt: >-
          Исправь только очевидные ошибки OCR в русском тексте, убери переносы
          слов между строками и лишние пробелы. Не добавляй факты. Верни только
          исправленный текст.

  document_header:
    name: Титульный блок
    fields:
      organization:
        name: Название организации
        prompt: >-
          Исправь OCR-ошибки в названии организации. Сохрани кавычки,
          аббревиатуры и организационно-правовую форму. Не добавляй отсутствующие
          слова. Верни только итоговое название.
      approval:
        name: Кем утверждено
        prompt: >-
          Исправь очевидные OCR-ошибки в блоке утверждения. Сохрани должность,
          звание, ФИО и дату, ничего не выдумывай. Верни только итоговый текст.
      agreement:
        name: Кем согласовано
        prompt: >-
          Исправь очевидные OCR-ошибки в блоке согласования. Сохрани должность,
          звание, ФИО и дату, ничего не выдумывай. Верни только итоговый текст.

  product:
    name: Изделие
    fields:
      name:
        name: Наименование
        prompt: >-
          Исправь OCR-ошибки в наименовании технического изделия. Сохрани
          обозначения, кавычки и регистр букв. Верни только наименование.
      level:
        name: Уровень
        prompt: >-
          Исправь OCR-ошибки в обозначении уровня изделия. Возможный смысл:
          комплекс, изделие, агрегат или узел. Не подменяй исходное значение.
      number:
        name: Номер техники
        prompt: >-
          Исправь только очевидные OCR-подмены в номере техники. Сохрани цифры,
          буквы, дефисы и косые черты. Верни только номер.

  process_card:
    name: Химмотологическая карта
    fields:
      number:
        name: Номер карты
        prompt: >-
          Исправь очевидные OCR-подмены в номере химмотологической карты.
          Сохрани формат, дефисы, точки, буквы и цифры. Верни только обозначение.

  frame:
    name: Рамка
    fields:
      inventory_number:
        name: Для инвентарного номера
        prompt: >-
          Исправь только очевидные OCR-подмены в инвентарном номере. Сохрани все
          цифры, буквы и разделители. Верни только номер.
      inventory_date:
        name: Дата инвентарной записи
        prompt: >-
          Исправь OCR-ошибки в дате инвентарной записи, не меняя дату и не
          додумывая цифры. Верни только дату.
      replacement_inventory_number:
        name: Взамен инвентарного №
        prompt: >-
          Исправь очевидные OCR-подмены в номере заменённого документа. Сохрани
          все знаки и формат. Верни только обозначение.
      duplicate_inventory_number:
        name: Инвентарный № дубликата
        prompt: >-
          Исправь OCR-подмены в инвентарном номере дубликата. Сохрани цифры,
          буквы и разделители. Верни только номер.
      developed_by:
        name: Разработал
        prompt: >-
          Исправь очевидные OCR-ошибки в ФИО или инициалах разработчика. Не
          добавляй должность или дату. Верни только имя.
      checked_by:
        name: Проверил
        prompt: >-
          Исправь очевидные OCR-ошибки в ФИО или инициалах проверяющего. Не
          добавляй должность или дату. Верни только имя.
      approved_by:
        name: Утвердил
        prompt: >-
          Исправь очевидные OCR-ошибки в ФИО или инициалах утвердившего. Не
          добавляй должность или дату. Верни только имя.
      approval_date:
        name: Дата основной надписи
        prompt: >-
          Исправь OCR-ошибки в дате основной надписи, не меняя её значение и не
          додумывая цифры. Верни только дату.

  table:
    name: Таблица
    fields:
      title:
        name: Заголовок
        prompt: >-
          Исправь OCR-ошибки в заголовке таблицы. Сохрани номер, обозначения и
          исходный смысл. Верни только заголовок.
      body:
        name: Блок строк
        kind: grid
        prompt: >-
          Исправь только очевидные OCR-ошибки в одной ячейке таблицы. Сохрани
          числа, единицы измерения, знаки и смысл. Не используй соседние ячейки.
          Верни только содержимое этой ячейки.
