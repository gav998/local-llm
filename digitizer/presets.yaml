default_prompt: >-
  Исправь только очевидные ошибки OCR в русском тексте, убери переносы слов
  между строками и лишние пробелы. Не добавляй факты. Верни только исправленный текст.

presets:
  - id: organization
    name: Название организации
    description: Наименование организации на титульном листе
    fields:
      - key: name
        name: Название организации
        ocr_mode: text
        prompt: >-
          Исправь OCR-ошибки в названии организации. Сохрани кавычки, аббревиатуры и организационно-правовую форму. Не добавляй отсутствующие слова. Верни только итоговое название.

  - id: approval
    name: Кем утверждено
    description: Должность, звание, ФИО и дата утверждения одним блоком
    fields:
      - key: approval_block
        name: Кем утверждено
        ocr_mode: text_seal
        prompt: >-
          Извлеки из OCR-текста сведения о том, кем утверждён документ: должность, воинское или специальное звание, фамилию, имя и отчество, дату. Верни одной строкой только найденные элементы в этом порядке, разделяя их запятыми. Если элемент отсутствует, пропусти его и не оставляй пустую позицию. Если есть читаемая текстовая отметка о подписи, добавь её последним элементом; графическую подпись не интерпретируй. Исправь только очевидные OCR-ошибки, ничего не выдумывай.

  - id: product
    name: Наименование и уровень изделия
    description: Комплекс, изделие, агрегат или узел и номер техники
    fields:
      - key: name
        name: Наименование
        ocr_mode: text
        prompt: >-
          Исправь OCR-ошибки в наименовании технического изделия. Сохрани обозначения, кавычки и регистр букв. Не добавляй характеристики. Верни только наименование.
      - key: level
        name: Уровень (комплекс / изделие / агрегат / узел)
        ocr_mode: text
        prompt: >-
          Исправь OCR-ошибки в обозначении уровня изделия. Ожидаемый смысл: комплекс, изделие, агрегат или узел. Не подменяй исходное значение. Верни только итоговый текст.
      - key: equipment_number
        name: Номер техники
        ocr_mode: text
        prompt: >-
          Исправь только очевидные OCR-подмены в номере техники. Сохрани все цифры, буквы, дефисы и косые черты; не додумывай знаки. Верни только номер.

  - id: process_card
    name: Номер химмотологической карты
    description: Обозначение или номер химмотологической карты
    fields:
      - key: number
        name: Номер химмотологической карты
        ocr_mode: text
        prompt: >-
          Исправь очевидные OCR-подмены в номере химмотологической карты. Сохрани формат, дефисы, точки, буквы и цифры. Не додумывай номер. Верни только итоговое обозначение.

  - id: agreement
    name: Кем согласовано
    description: Должность, звание, ФИО и дата согласования одним блоком
    fields:
      - key: agreement_block
        name: Кем согласовано
        ocr_mode: text_seal
        prompt: >-
          Извлеки из OCR-текста сведения о том, кем согласован документ: должность, воинское или специальное звание, фамилию, имя и отчество, дату. Верни одной строкой только найденные элементы в этом порядке, разделяя их запятыми. Если элемент отсутствует, пропусти его и не оставляй пустую позицию. Если есть читаемая текстовая отметка о подписи, добавь её последним элементом; графическую подпись не интерпретируй. Исправь только очевидные OCR-ошибки, ничего не выдумывай.

  - id: frame
    name: Рамка
    description: Поля инвентарной и основной надписи
    fields:
      - key: inventory_number
        name: Для инвентарного номера
        ocr_mode: text
        prompt: >-
          Исправь только очевидные OCR-подмены в инвентарном номере. Сохрани все цифры, буквы и разделители; не додумывай знаки. Верни только номер.
      - key: inventory_signature
        name: Инвентарный номер — подпись
        ocr_mode: none
        prompt: >-
          Исправь очевидные опечатки в пометке о подписи к инвентарному номеру. Не додумывай имя. Верни только итоговое значение.
      - key: inventory_date
        name: Инвентарный номер — дата
        ocr_mode: text
        prompt: >-
          Исправь OCR-ошибки в дате инвентарной записи, не меняя дату и не додумывая цифры. Верни только дату.
      - key: replacement_inventory_number
        name: Взамен инвентарного №
        ocr_mode: text
        prompt: >-
          Исправь очевидные OCR-подмены в номере заменённого документа. Сохрани все знаки и формат; не додумывай номер. Верни только итоговое обозначение.
      - key: duplicate_inventory_number
        name: Инвентарный № дубликата
        ocr_mode: text
        prompt: >-
          Исправь OCR-подмены в инвентарном номере дубликата. Сохрани цифры, буквы и разделители; не додумывай знаки. Верни только номер.
      - key: duplicate_signature
        name: Дубликат — подпись
        ocr_mode: none
        prompt: >-
          Исправь очевидные опечатки в пометке о подписи дубликата. Не выдумывай имя. Верни только итоговое значение.
      - key: duplicate_date
        name: Дубликат — дата
        ocr_mode: text
        prompt: >-
          Исправь OCR-ошибки в дате дубликата, не меняя её значение и не додумывая цифры. Верни только дату.
      - key: developed_by
        name: Разработал
        ocr_mode: text
        prompt: >-
          Исправь очевидные OCR-ошибки в ФИО или инициалах разработчика. Не добавляй должность, дату или нечитаемые буквы. Верни только итоговое имя.
      - key: checked_by
        name: Проверил
        ocr_mode: text
        prompt: >-
          Исправь очевидные OCR-ошибки в ФИО или инициалах проверяющего. Не добавляй должность, дату или нечитаемые буквы. Верни только итоговое имя.
      - key: approved_by
        name: Утвердил
        ocr_mode: text
        prompt: >-
          Исправь очевидные OCR-ошибки в ФИО или инициалах утвердившего. Не добавляй должность, дату или нечитаемые буквы. Верни только итоговое имя.
      - key: approval_date
        name: Дата основной надписи
        ocr_mode: text
        prompt: >-
          Исправь OCR-ошибки в дате основной надписи, не меняя её значение и не додумывая цифры. Верни только дату.

  # Legacy presets remain readable for previously saved documents, but the UI
  # offers the consolidated "Рамка" object above for new markup.
  - id: frame_inventory
    name: 'Рамка: инвентарный номер'
    description: Инвентарный номер, подпись и дата
    fields:
      - key: inventory_number
        name: Инвентарный номер
        ocr_mode: text
        prompt: >-
          Исправь только очевидные OCR-подмены в инвентарном номере. Сохрани все цифры, буквы и разделители; не додумывай знаки. Верни только номер.
      - key: signature
        name: Подпись
        ocr_mode: none
        prompt: >-
          Исправь очевидные опечатки в пометке о подписи к инвентарному номеру. Не додумывай имя. Верни только итоговое значение.
      - key: date
        name: Дата
        ocr_mode: text
        prompt: >-
          Исправь OCR-ошибки в дате инвентарной записи, не меняя дату и не додумывая цифры. Верни только дату.

  - id: frame_replacement
    name: 'Рамка: взамен инвентарного'
    description: Инвентарный номер заменённого документа
    fields:
      - key: replacement_inventory_number
        name: Взамен инвентарного №
        ocr_mode: text
        prompt: >-
          Исправь очевидные OCR-подмены в номере заменённого документа. Сохрани все знаки и формат; не додумывай номер. Верни только итоговое обозначение.

  - id: frame_duplicate
    name: 'Рамка: дубликат'
    description: Инвентарный номер дубликата, подпись и дата
    fields:
      - key: duplicate_inventory_number
        name: Инвентарный № дубликата
        ocr_mode: text
        prompt: >-
          Исправь OCR-подмены в инвентарном номере дубликата. Сохрани цифры, буквы и разделители; не додумывай знаки. Верни только номер.
      - key: signature
        name: Подпись
        ocr_mode: none
        prompt: >-
          Исправь очевидные опечатки в пометке о подписи дубликата. Не выдумывай имя. Верни только итоговое значение.
      - key: date
        name: Дата
        ocr_mode: text
        prompt: >-
          Исправь OCR-ошибки в дате дубликата, не меняя её значение и не додумывая цифры. Верни только дату.

  - id: maintenance_periodicity
    name: Периодичность технического обслуживания
    description: Период или условие выполнения ТО
    fields:
      - key: periodicity
        name: Периодичность
        ocr_mode: text
        prompt: >-
          Исправь OCR-ошибки в периодичности технического обслуживания. Сохрани числа, единицы измерения и условия; не меняй интервал. Верни только итоговый текст.

  - id: frame_people
    name: 'Рамка: разработал / утвердил'
    description: Типовые поля основной надписи без OCR таблицы
    fields:
      - key: developed_by
        name: Разработал
        ocr_mode: text
        prompt: >-
          Исправь очевидные OCR-ошибки в ФИО или инициалах разработчика. Не добавляй должность, дату или нечитаемые буквы. Верни только итоговое имя.
      - key: checked_by
        name: Проверил
        ocr_mode: text
        prompt: >-
          Исправь очевидные OCR-ошибки в ФИО или инициалах проверяющего. Не добавляй должность, дату или нечитаемые буквы. Верни только итоговое имя.
      - key: approved_by
        name: Утвердил
        ocr_mode: text
        prompt: >-
          Исправь очевидные OCR-ошибки в ФИО или инициалах утвердившего. Не добавляй должность, дату или нечитаемые буквы. Верни только итоговое имя.
      - key: date
        name: Дата
        ocr_mode: text
        prompt: >-
          Исправь OCR-ошибки в дате основной надписи, не меняя её значение и не додумывая цифры. Верни только дату.

  - id: custom_field
    name: Произвольное поле
    description: Один текстовый объект с настраиваемым названием
    dynamic_field_prompt: >-
      Исправь только очевидные OCR-ошибки в значении произвольного поля. Убери лишние пробелы и случайные переносы слов, не добавляй факты. Верни только итоговый текст.
    fields:
      - key: value
        name: Значение
        ocr_mode: text
        prompt: >-
          Исправь только очевидные OCR-ошибки в значении произвольного поля. Убери лишние пробелы и случайные переносы слова, не добавляй факты. Верни только итоговый текст.

  - id: table
    name: Таблица
    description: Ручные заголовки, сетка строк и группирующие значения
    type: table
    dynamic_field_prompt: >-
      Исправь OCR-ошибки в заголовке или группирующем значении таблицы. Сохрани термины, единицы измерения и обозначения. Верни только итоговый текст.
    cell_prompt: >-
      Исправь только очевидные OCR-ошибки в одной ячейке таблицы. Сохрани числа, единицы измерения, знаки и смысл; не переноси данные из соседних ячеек. Верни только итоговое значение.
